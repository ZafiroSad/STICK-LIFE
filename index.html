/* Aviso de medidas en Hoy: solo aparece cuando ya toca según la meta (o si nunca se han tomado).
   Es el "recuerda" del ciclo de medidas; el detalle vive en Progreso. */
function measureReminderBanner(){
  const st=measureStatus();
  if(st.state==="ok")return "";
  const first=st.state==="first";
  return `<div class="notice" id="measNotice">
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--amber)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v3.5"/></svg>
    <div style="flex:1;min-width:0">
      <div class="h3" style="font-size:13px">${first?"Toma tus medidas de partida":"Toca tomar medidas"}</div>
      <div class="sub" style="font-size:11px;margin-top:2px">${first?"Hombro, pecho, bíceps, cintura, muslos y pantorrillas":`La última fue hace ${st.passed} ${st.passed===1?"día":"días"}`}</div>
    </div>
    <span style="flex:none;color:var(--zinc-500)">${IC.chevron}</span></div>`;
}
/* ---------- Marcado sin re-render ----------
   Antes, marcar un ejercicio llamaba a renderHoy(): el nodo del check se destruía y volvía a
   nacer ya marcado, así que la transición no tenía estado previo desde el cual animar y, de
   paso, la entrada escalonada de la lista se relanzaba entera. Aquí se tocan solo las tres
   cosas que de verdad cambian: la fila, la barra del día y la píldora de la semana. */
function paintDayProgress(){
  const pct=dayProgress(selectedDay);
  const bar=$("#dayBar"),num=$("#dayPct");
  if(bar)bar.style.width=pct+"%";
  if(num)num.textContent=pct+"%";
}
function setCheck(i,done){
  const k=checkKey(selectedDay,i);
  if(done)S.checks[k]=true;else delete S.checks[k]; // borrar en vez de guardar false: no deja basura en el respaldo
  const row=$("#v-hoy").querySelector(`.ex[data-idx="${i}"]`);
  if(row)row.classList.toggle("done",done);
}
/* ---------- Repintado en sitio (regla de v1.13.0) ----------
   NADA de lo que se toca durante una sesión puede llamar a `renderHoy()`. Reconstruir el
   `innerHTML` entero relanza el escalonado de toda la lista, mata la animación del elemento que
   cambió (nace ya en su estado final, sin nada desde donde animar) y —lo más visible— **salta el
   scroll**: el Señor Stick se queda mirando otra parte de la pantalla. Estas tres funciones tocan
   solo el nodo que cambió. */
function pintarMarca(iso,animar){
  const strip=$("#v-hoy .weekstrip");
  if(strip){
    const antes=+($("#wsNum")||{textContent:0}).textContent||0;
    const tmp=document.createElement("div");
    tmp.innerHTML=weekStrip();
    const nueva=tmp.firstElementChild;
    strip.parentNode.replaceChild(nueva,strip);
    nueva.querySelectorAll("[data-wd]").forEach(p=>p.onclick=()=>go("calendario"));
    const reducido=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if(animar&&!reducido){
      const punto=nueva.querySelector(`[data-wd="${iso}"]`);
      if(punto)punto.classList.add("recien");
      if((+$("#wsNum").textContent||0)>antes)nueva.querySelector(".wstreak").classList.add("sube");
    }
  }
  const mc=$("#markCard");
  if(mc){
    const t=document.createElement("div");
    t.innerHTML=markCard(iso);
    mc.parentNode.replaceChild(t.firstElementChild,mc);
    bindMarkCard();
  }
}
function bindMarkCard(){
  const mk=$("#mkToggle");if(!mk)return;
  mk.onclick=()=>{
    const iso=$("#markCard").dataset.iso;
    const e=dayState(iso);
    if(e==="entrenado"||e==="libre"){desmarcarDia(iso);pintarMarca(iso,false);toast("Marca quitada");}
    else{
      marcarEntrenado(iso);
      try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}
      pintarMarca(iso,true);toast("Día marcado");
    }
  };
}
/* Repinta el peso de UNA fila: el botón y la línea de metadatos. No sustituye el nodo de la fila
   para no relanzarle la animación de entrada. */
function pintarFilaPeso(i){
  const fila=$("#v-hoy").querySelector(`.ex[data-idx="${i}"]`);
  if(!fila)return;
  const item=activeRoutine().days[selectedDay].exercises[i];
  const e=getEx(item.exId);if(!e)return;
  const iso=todayKey();
  const w=pesoDe(item.exId,iso), prev=pesoPrevio(item.exId,iso);
  const delta=w!=null&&prev?+(w-prev.weight).toFixed(1):null;
  const btn=fila.querySelector("[data-peso]");
  btn.classList.toggle("logged",w!=null);
  btn.title=w!=null?`${w} ${LB} — tocar para cambiar`:"Anotar el peso de hoy";
  btn.innerHTML=w!=null?`<span class="elv">${w}</span><span class="elk">${LB}</span>`
                       :`<span class="elv">${IC.plus}</span><span class="elk">Peso</span>`;
  const meta=fila.querySelector(".ex-meta");
  if(meta)meta.innerHTML=`${e.group} · ${item.sets}×${item.reps}`
    +(prev&&w==null?` · última vez <b class="mono">${prev.weight}</b> ${LB}`:"")
    +(delta!=null&&delta!==0?` · <span style="color:var(--${delta>0?"emerald":"amber"});font-weight:700">${delta>0?"+":""}${delta} ${LB}</span>`:"");
}
/* Al completar TODOS los ejercicios, el día se marca solo. Pedido del Señor Stick: si tildó la
   lista entera, evidentemente entrenó, y pedirle un toque más sobra. Solo enciende — nunca apaga:
   destildar un ejercicio después no borra un entrenamiento que sí ocurrió. */
function autoMarcarSiCompleto(){
  const iso=todayKey();
  if(dayProgress(selectedDay)!==100)return;
  const e=dayState(iso);
  if(e==="entrenado"||e==="libre")return;
  marcarEntrenado(iso);
  pintarMarca(iso,true);
  toast("Día completo · marcado como entrenado");
}

function bindHoy(){
  const mn=$("#measNotice");if(mn)mn.onclick=()=>{mzOpen=true;openPerfil();}; // el aviso lleva al Perfil, donde viven las medidas
  const fc=$("#freeCard");if(fc)fc.onclick=()=>openFreeSheet(fc.dataset.iso);
  bindMarkCard();
  /* Los puntos de la tira son indicador, no navegación: llevan al Calendario, que es de donde
     se marca cualquier día que no sea hoy. */
  $("#v-hoy").querySelectorAll("[data-wd]").forEach(p=>p.onclick=()=>go("calendario"));
  $("#v-hoy").querySelectorAll("[data-check]").forEach(c=>c.onclick=e=>{
    e.stopPropagation();const i=+c.dataset.check;
    const nowDone=!isChecked(selectedDay,i);
    setCheck(i,nowDone);save();paintDayProgress();
    if(nowDone){try{if(navigator.vibrate)navigator.vibrate(15);}catch(_){}autoMarcarSiCompleto();}
  });
  $("#v-hoy").querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openExercise(b.dataset.open));
  $("#v-hoy").querySelectorAll("[data-peso]").forEach(b=>b.onclick=e=>{
    e.stopPropagation();openPesoSheet(+b.dataset.peso);
  });
  const rd=$("#resetDay");if(rd)rd.onclick=()=>{
    activeRoutine().days[selectedDay].exercises.forEach((_,i)=>setCheck(i,false));
    save();paintDayProgress();toast("Día reiniciado");
  };
}

/* ---------- Registro de pesos (por ejercicio, serie por serie) ---------- */
function nSetsOf(item){return Math.max(1,Math.min(12,parseInt(item.sets)||3));}
function epley(x){return (x.weight||0)*(1+(x.reps||0)/30);}
function bestSet(rows){return rows.reduce((a,b)=>epley(b)>epley(a)?b:a);}
function entrySets(l){return (l.sets&&l.sets.length)?l.sets:[{weight:l.weight,reps:l.reps}];}
/* Registro de un ejercicio en la fecha del día seleccionado (no necesariamente hoy). */
function dayEntry(exId,dayId){
  const t=dateOfDay(dayId);
  return (S.history||[]).filter(l=>l.exId===exId&&l.date===t).slice(-1)[0]||null;
}
/* ============================================================
   VISTA: RUTINAS
   ============================================================ */
function renderRutinas(){

    const isA=r.id===S.activeRoutineId;

    const totalEx=Object.values(r.days).reduce((a,d)=>a+d.exercises.length,0);
    h+=`<div class="card hoverable tap" style="padding:16px;margin-bottom:10px" data-routine="${r.id}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
        <div style="min-width:0">
          <div class="h3">${r.name}</div>
          <div class="sub" style="margin-top:4px">${trainDays} días · ${totalEx} ejercicios</div>

        ${DAYS.map(([id,l])=>`<span class="chip" style="${r.days[id].rest?'opacity:.4':''}">${l.slice(0,2)}</span>`).join("")}
      </div>

function createRoutine(){
  promptSheet({title:"Nueva rutina",label:"Nombre",value:"Mi rutina",placeholder:"Ej. Fuerza, Volumen, Viaje",cta:"Crear",onSave:name=>{
    const days={};DAYS.forEach(([id])=>days[id]=d("Descanso",true,[]));

    S.routines.push(r);save();renderRutinas();openRoutine(r.id);toast("Rutina creada");
  }});
}
function openRoutine(rid){
  const r=S.routines.find(x=>x.id===rid);if(!r)return;
  const isA=r.id===S.activeRoutineId;
  let h=`<div class="sheet-grab"></div><div class="sheet-head">
    <div style="min-width:0"><div class="h2">${r.name}</div><div class="sub" style="margin-top:2px">${isA?"Rutina activa":"Editar plan semanal"}</div></div>
    <button class="close-x" data-close>×</button></div>`;
  h+=`<div style="display:flex;gap:8px;margin:12px 0 4px">

function editDay(rid,dayId){
  const r=S.routines.find(x=>x.id===rid);const day=r.days[dayId];
  let h=`<div class="sheet-grab"></div><div class="sheet-head">
    <div><span class="label-mono">${DAYNAME[dayId]}</span><div class="h2" style="margin-top:2px">Editar día</div></div>

  h+=`<div class="field" style="margin-top:12px"><label>Enfoque del día</label>
    <input type="text" id="dayFocus" value="${day.rest?'':day.focus}" placeholder="Ej. Torso A, Empuje, Pierna"></div>`;
  h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px">
    <span class="sub">Marcar como descanso</span>
    <button class="btn-secondary" id="toggleRest">${day.rest?"Es descanso":"Es entreno"}</button></div>`;
  h+=`<div id="dayExList"></div>`;

  openSheet(h);
  let draft=day.rest?[]:structuredClone(day.exercises);
  let isRest=day.rest;
  function renderList(){
    const el=$("#dayExList");
    if(isRest){el.innerHTML=`<p class="muted" style="text-align:center;padding:12px">Día de descanso — sin ejercicios.</p>`;return;}
    if(!draft.length){el.innerHTML=`<p class="muted" style="text-align:center;padding:12px">Sin ejercicios aún. Añade desde el catálogo.</p>`;return;}
    el.innerHTML=draft.map((item,i)=>{const e=getEx(item.exId);return `
      <div class="card" style="padding:12px;margin-bottom:7px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span class="h3" style="font-size:13px">${e?e.name:"?"}</span>
          <button class="icon-btn" data-rm="${i}" style="width:30px;height:30px" title="Quitar"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="row2">
          <div class="field" style="margin:0"><label>Series</label><input type="number" inputmode="numeric" data-s="${i}" value="${item.sets}"></div>
          <div class="field" style="margin:0"><label>Reps</label><input type="text" data-rp="${i}" value="${item.reps}"></div>
        </div>
      </div>`;}).join("");
    el.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{draft.splice(+b.dataset.rm,1);renderList();});
    el.querySelectorAll("[data-s]").forEach(inp=>inp.onchange=()=>draft[+inp.dataset.s].sets=parseInt(inp.value)||1);
    el.querySelectorAll("[data-rp]").forEach(inp=>inp.onchange=()=>draft[+inp.dataset.rp].reps=inp.value.trim()||"10");
  }
  renderList();
  $("#toggleRest").onclick=()=>{isRest=!isRest;$("#toggleRest").textContent=isRest?"Es descanso":"Es entreno";renderList();};
  $("#addEx").onclick=()=>pickExercise(exId=>{draft.push(it(exId,3,"10-12"));isRest=false;$("#toggleRest").textContent="Es entreno";renderList();});
  $("#saveDay").onclick=()=>{
    if(isRest){r.days[dayId]=d("Descanso",true,[]);}
    else{const f=$("#dayFocus").value.trim()||"Entreno";r.days[dayId]=d(f,false,draft);}
    save();openRoutine(rid);renderRutinas();renderHoy();toast("Día guardado");
  };

/* Con 82 ejercicios en el catálogo, la lista completa mide más de 6.000 px: buscar a ojo dejó de
   ser viable. El filtro mira nombre, músculo y equipo —"polea", "dorsal" y "remo" son tres formas
   igual de legítimas de buscar lo mismo— y los chips acotan por grupo de un toque. */
function normalizar(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function pickExercise(cb){
  let grupoSel=null;
  let h=`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">Añadir ejercicio</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:10px"><input type="text" id="exSearch" placeholder="Nombre, músculo o equipo..."></div>
    <div class="fchips" id="pickChips">${GROUPS.map(g=>`<button class="fchip" data-pg="${g}">${g}</button>`).join("")}</div>
    <div id="pickList"></div>`;
  openSheet2(h);
  function coincide(e,q){
    if(!q)return true;
    return normalizar(e.name).includes(q)||normalizar(e.eq).includes(q)
      ||normalizar(e.group).includes(q)||(e.muscles||[]).some(m=>normalizar(m).includes(q));
  }
  function draw(){
    const q=normalizar($("#exSearch").value||"");
    const list=$("#pickList");let out="",n=0;
    GROUPS.forEach(g=>{
      if(grupoSel&&g!==grupoSel)return;
      const items=allEx().filter(e=>e.group===g&&coincide(e,q));
      if(!items.length)return;
      n+=items.length;
      out+=`<div class="label-mono" style="margin:14px 0 8px">${g} · ${items.length}</div>`;
      out+=items.map(e=>`<div class="cat-item" data-pick="${e.id}"><div class="mg-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--zinc-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${MG_ICON[g]}"/></svg></div><div style="flex:1"><div class="ex-name" style="font-size:13px">${e.name}</div><div class="ex-meta">${e.eq} · ${e.sets}×${e.reps}</div></div>${IC.chevron}</div>`).join("");
    });
    list.innerHTML=n?out:`<p class="muted" style="text-align:center;padding:20px">Sin resultados.</p>`;
    list.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{cb(b.dataset.pick);closeSheet2();});
  }
  $("#pickChips").querySelectorAll("[data-pg]").forEach(b=>b.onclick=()=>{
    const ya=grupoSel===b.dataset.pg;
    grupoSel=ya?null:b.dataset.pg;
    $("#pickChips").querySelectorAll("[data-pg]").forEach(x=>x.classList.remove("sel"));
    if(!ya)b.classList.add("sel");
    draw();
  });
  draw();
  $("#exSearch").oninput=draw;
}

function renderEjercicios(){
  let h=`<div class="view-head" style="display:flex;justify-content:space-between;align-items:flex-end">
    <div><div class="label">Base de datos</div><div class="h1" style="margin-top:2px">Ejercicios</div></div>

  h+=`<div id="catList"></div>`;
  $("#v-ejercicios").innerHTML=h;
  const draw=q=>{
    q=normalizar(q||"");let out="";
    GROUPS.forEach(g=>{
      const items=allEx().filter(e=>e.group===g&&(!q||normalizar(e.name).includes(q)
        ||normalizar(e.eq).includes(q)||normalizar(e.group).includes(q)
        ||(e.muscles||[]).some(m=>normalizar(m).includes(q))));
      if(!items.length)return;
      out+=`<div class="cat-group"><div class="label-mono" style="margin-bottom:9px">${g} · ${items.length}</div>`;
      out+=items.map(e=>`<div class="cat-item" data-open="${e.id}">
        <div class="mg-ico"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="var(--zinc-400)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="${MG_ICON[g]}"/></svg></div>
        <div style="flex:1;min-width:0"><div class="ex-name" style="font-size:13px">${e.name}</div><div class="ex-meta">${e.eq} · ${e.sets}×${e.reps}</div></div>

      out+=`</div>`;
    });

  const de=$("#delEx");if(de)de.onclick=()=>confirmSheet({title:"Eliminar ejercicio",message:"¿Eliminar este ejercicio del catálogo?",cta:"Eliminar",danger:true,onConfirm:()=>{S.customEx=S.customEx.filter(c=>c.id!==exId);save();closeSheet();renderEjercicios();toast("Ejercicio eliminado");}});

const ACT=[["1.2","Sedentario (poco o nada)"],["1.375","Ligero (1-3 días/sem)"],["1.55","Moderado (3-5 días/sem)"],["1.725","Alto (6-7 días/sem)"],["1.9","Muy alto (físico + doble sesión)"]];
const GOALS=[["recomp","Recomposición","Mantén calorías, gana músculo y pierde grasa lento","1"],
  ["magro","Superávit magro","Sube músculo con mínima grasa. El más indicado para un físico atlético","1.12"],
  ["deficit","Déficit","Baja grasa conservando músculo","0.82"]];
function renderNutricion(){
  const p=S.profile;
  let h=`<div class="view-head"><div class="label">Combustible</div><div class="h1" style="margin-top:2px">Nutrición</div>
    <div class="sub" style="margin-top:4px">Calcula tus calorías y macros diarios según tu objetivo.</div></div>`;

    <div class="row2">

function doCalc(){
  const sex=$("#n-sex").value,age=+$("#n-age").value,w=+$("#n-w").value,ht=+$("#n-h").value,act=+$("#n-act").value,goal=$("#n-goal").value;
  if(!age||!w||!ht)return toast("Completa edad, peso y estatura");
  const p={sex,age,weight:w,height:ht,act,goal};
  S.profile=p;save();renderNutResult(p);
  setTimeout(()=>$("#nutResult").scrollIntoView({behavior:"smooth",block:"nearest"}),50);

function renderNutResult(p){
  // Mifflin-St Jeor
  const bmr=Math.round(10*p.weight+6.25*p.height-5*p.age+(p.sex==="h"?5:-161));
  const tdee=Math.round(bmr*p.act);
  const g=GOALS.find(x=>x[0]===p.goal);
  const kcal=Math.round(tdee*parseFloat(g[3]));
  const protein=Math.round(p.weight*2.0);              // 2.0 g/kg
  const fat=Math.round(kcal*0.25/9);                    // 25% kcal
  const carbs=Math.round((kcal-(protein*4+fat*9))/4);
  const water=(p.weight*0.035).toFixed(1);
  $("#nutResult").innerHTML=`
    <div class="label-mono" style="margin-bottom:10px">Tu plan diario · ${g[1]}</div>
    <div class="card" style="padding:20px;text-align:center;margin-bottom:12px">
      <div class="label" style="letter-spacing:.16em">Calorías objetivo</div>
      <div style="font-size:44px;font-weight:800;letter-spacing:-.02em;color:#fff;margin-top:4px" class="mono">${kcal}<small style="font-size:16px;color:var(--zinc-500);font-weight:700"> kcal</small></div>
      <div class="muted" style="margin-top:6px">Mantenimiento: <b class="mono" style="color:var(--zinc-400)">${tdee} kcal</b> · BMR: <b class="mono" style="color:var(--zinc-400)">${bmr}</b></div>
    </div>
    <div class="card" style="padding:16px;margin-bottom:12px">
      <div class="macro-line"><span class="macro-dot" style="background:var(--emerald)"></span>
        <div style="flex:1"><div class="h3" style="font-size:14px">Proteína</div><div class="muted">2.0 g por kg</div></div>
        <div class="mono" style="font-weight:800;font-size:18px">${protein}<small style="color:var(--zinc-500);font-size:12px"> g</small></div></div>
      <div class="macro-line"><span class="macro-dot" style="background:var(--amber)"></span>
        <div style="flex:1"><div class="h3" style="font-size:14px">Carbohidratos</div><div class="muted">energía de entreno</div></div>
        <div class="mono" style="font-weight:800;font-size:18px">${carbs}<small style="color:var(--zinc-500);font-size:12px"> g</small></div></div>
      <div class="macro-line"><span class="macro-dot" style="background:var(--sky)"></span>
        <div style="flex:1"><div class="h3" style="font-size:14px">Grasas</div><div class="muted">25% de calorías</div></div>
        <div class="mono" style="font-weight:800;font-size:18px">${fat}<small style="color:var(--zinc-500);font-size:12px"> g</small></div></div>

function sparkline(vals,color){
  color=color||"#ffffff";
  if(!vals||vals.length<2)return `<div class="muted" style="padding:8px 0">Registra al menos 2 datos para ver la tendencia.</div>`;
  const W=280,H=54,pad=5;
  const min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const X=i=>pad+(i/(vals.length-1))*(W-2*pad);
  const Y=v=>H-pad-((v-min)/rng)*(H-2*pad);
  const line=vals.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
  const area=`${pad},${H-pad} ${line} ${W-pad},${H-pad}`;
  const lv=vals[vals.length-1];
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:52px;display:block">
    <polygon points="${area}" fill="${color}" opacity="0.09"/>
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${X(vals.length-1).toFixed(1)}" cy="${Y(lv).toFixed(1)}" r="3.2" fill="${color}"/>
  </svg>`;
}
function weeksBetween(d1,d2){return Math.max(0,(new Date(d2)-new Date(d1))/(6048e5));}
/* "2026-08-02" → "02 ago". Se parte el texto en vez de usar new Date(): esa función
   interpreta medianoche UTC y en Colombia (UTC-5) mostraría el día anterior. */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function fechaCorta(iso){const p=String(iso).split("-");return p[2]+" "+(MESES[+p[1]-1]||"");}
function fechaLarga(iso){const p=String(iso).split("-");return p[2]+" de "+(MESES[+p[1]-1]||"")+" de "+p[0];}
const RATE_LABEL={"0.5":"+0.5 kg/sem (agresivo)","0.25":"+0.25 kg/sem (magro)","0":"Mantener peso","-0.25":"-0.25 kg/sem","-0.5":"-0.5 kg/sem (definición)"};
function goalRateFromNutrition(){
  if(!S.profile)return "0.25";
  return {magro:"0.25",recomp:"0",deficit:"-0.5"}[S.profile.goal]||"0.25";
}

/* Hoja de un día del calendario: marcar, marcar como libre, o quitar la marca. */
function openDaySheet(iso){
  const e=dayState(iso);

/* ---------- Asistencia (se deriva sola de checks + registros de peso) ---------- */
const DAY_IDS=["dom","lun","mar","mie","jue","vie","sab"];
const MESES_LARGO=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
let calYM=null; // {y,m} del mes que se está viendo; null = mes actual
function isoOf(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
/* Estadística de un día para el calendario. `estado` es la verdad (ver dayState); `done`/`total`
   siguen existiendo solo para pintar el anillo de avance de la sesión, no para decidir si el
   día cuenta como entrenado. */
function dayStats(iso){
  const p=iso.split("-");
  const dayId=DAY_IDS[new Date(+p[0],+p[1]-1,+p[2]).getDay()];
  const day=activeRoutine().days[dayId];
  const rest=!day||day.rest;
  const total=rest?0:day.exercises.length;
  let done=0;
  const pre=iso+"|";
  Object.keys(S.checks||{}).forEach(k=>{if(S.checks[k]&&k.indexOf(pre)===0)done++;});
  const estado=dayState(iso);
  const free=freeOf(iso);
  return {rest,total,done,free,estado,
    trained:estado==="entrenado"||estado==="libre",
    fallado:estado==="fallado",
    full:total>0&&done>=total};
}
/* Racha: días consecutivos hacia atrás sin un fallo. El descanso no suma ni rompe — es parte del
   plan, y castigarlo haría que la racha premiara sobreentrenar. Un día pendiente de hoy tampoco
   rompe: todavía hay tiempo de entrenar. */
function currentStreak(){
  const d=new Date();let n=0;
  for(let i=0;i<400;i++){
    const e=dayState(isoOf(d));
    if(e==="entrenado"||e==="libre")n++;
    else if(e==="fallado")break;
    else if(e==="pendiente"&&i>0)break;   // hoy pendiente no rompe; ayer pendiente ya es fallado
    d.setDate(d.getDate()-1);
  }
  return n;
}
function attendanceBlock(){
  const now=new Date();
  const y=calYM?calYM.y:now.getFullYear(), m=calYM?calYM.m:now.getMonth();
  const isCur=y===now.getFullYear()&&m===now.getMonth();
  const first=new Date(y,m,1), nDays=new Date(y,m+1,0).getDate();
  const lead=(first.getDay()+6)%7;                  // la semana empieza en lunes
  const todayIso=todayKey();
  let hechos=0,programados=0,cells="";
  for(let i=0;i<lead;i++)cells+=`<div class="calcell blank"></div>`;
  for(let d=1;d<=nDays;d++){
    const iso=isoOf(new Date(y,m,d));
    const st=dayStats(iso);
    const future=iso>todayIso;
    /* Un día de descanso en el que sí entrenaste entra también en el denominador: si no, el
       porcentaje de cumplimiento se pasaría del 100 %. */
    if(!future&&(st.estado!=="descanso"||st.trained))programados++;
    if(st.trained)hechos++;
    /* El día marcado se pinta lleno aunque queden ejercicios sin tildar: desde el rediseño v2 la
       marca del día es la verdad y los checks son solo una ayuda durante la sesión. */
    let cls=st.estado==="entrenado"?"full"
      :st.estado==="libre"?"free"
      :st.estado==="descanso"?"rest"
      :st.estado==="fallado"?"miss":"";
    if(future)cls+=" fut";
    if(iso===todayIso)cls+=" today";
    const detalle=st.estado==="descanso"?" · descanso"
      :st.estado==="entrenado"?(st.done?` · ${st.done}/${st.total} ejercicios`:" · entrenado")
      :st.estado==="libre"?` · libre: ${st.free}`
      :st.estado==="fallado"?" · sin registro":" · pendiente";
    const info=`${fechaLarga(iso)}${detalle}`;
    cells+=`<div class="calcell ${cls}" data-cal="${info}" data-iso="${iso}" title="${info}">${d}</div>`;
  }
  const pct=programados?Math.round(hechos/programados*100):0;
  const racha=currentStreak();
  let h=`<div class="card" style="padding:18px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px">
      <div style="flex:1;min-width:0">
        <div class="h3">${MESES_LARGO[m]} ${y}</div>
        <div class="sub" style="margin-top:2px">${hechos} ${hechos===1?"sesión":"sesiones"}${programados?` · ${pct}% cumplido`:""}</div>
      </div>
      <button class="icon-btn" id="calPrev" title="Mes anterior" style="flex:none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button class="icon-btn" id="calNext" title="Mes siguiente" style="flex:none${isCur?";opacity:.35":""}" ${isCur?"disabled":""}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
    <div class="calhead">${DAYS.map(([,l])=>`<span>${l.slice(0,2)}</span>`).join("")}</div>
    <div class="calgrid">${cells}</div>
    <div class="callegend">
      <span><i style="background:var(--emerald)"></i>Entrenado</span>
      <span><i style="background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.38)"></i>Libre</span>
      <span><i style="background:var(--sup-2);border-color:rgba(251,113,133,.28)"></i>Sin registro</span>
      <span><i style="background:var(--sup);border-color:var(--brd)"></i>Descanso</span>
    </div>`;
  h+=`<div style="display:flex;gap:10px;margin-top:14px">
    <div class="stat" style="flex:1;padding:12px 14px"><div class="label">Racha</div>
      <div class="mono" style="font-size:20px;font-weight:800;color:${racha?'var(--emerald)':'var(--zinc-400)'}">${racha}<small style="font-size:11px;color:var(--zinc-500);font-weight:700"> ${racha===1?"sesión":"sesiones"}</small></div></div>
    <div class="stat" style="flex:1;padding:12px 14px"><div class="label">Este mes</div>
      <div class="mono" style="font-size:20px;font-weight:800">${hechos}<small style="font-size:11px;color:var(--zinc-500);font-weight:700">${programados?" / "+programados:""}</small></div></div>
  </div>`;
  h+=`<p class="muted" style="margin-top:12px;font-size:11px"><b style="color:var(--zinc-400)">Toca cualquier día</b> para marcarlo, incluido uno de semanas pasadas: se abre aquí mismo y eliges si entrenaste la rutina o algo distinto (<b style="color:var(--sky)">azul</b>). Los días de descanso los pone tu rutina y no cuentan en contra. Un día pasado que tenía plan y quedó sin marcar sale en <b style="color:var(--rose)">rojo</b> solo — no hace falta que registres nada para eso.</p></div>`;
  return h;
}

function weightBlock(){
  const logs=(S.weightLog||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const cur=logs.length?logs[logs.length-1].kg:null;
  const g=S.weightGoal;
  let h=`<div class="card" style="padding:18px">
    <div class="card-head">
      <div class="h3">Peso corporal</div>

        ${logs.length?`<button class="btn-secondary" id="histWeight" style="padding:8px 13px">Historial</button>`:``}

      </div>

  if(cur==null&&!g){
    h+=`<div class="empty" style="padding:12px 8px"><p class="sub">Aún no registras tu peso. Pulsa <b style="color:var(--zinc-300)">Registrar</b> para empezar y define tu meta con el botón de diana.</p></div></div>`;
    return h;
  }
  h+=`<div style="display:flex;align-items:flex-end;gap:22px;margin-bottom:14px;flex-wrap:wrap">
    <div><div class="label">Actual</div><div class="mono" style="font-size:34px;font-weight:800;color:#fff;line-height:1">${cur!=null?cur:"—"}<small style="font-size:14px;color:var(--zinc-500);font-weight:700"> kg</small></div></div>`;
  if(g){
    h+=`<div><div class="label">Meta</div><div class="mono" style="font-size:22px;font-weight:800;color:var(--zinc-300);line-height:1.5">${g.target}<small style="font-size:12px;color:var(--zinc-600)"> kg</small></div></div>`;
    if(cur!=null){const diff=g.target-cur;
      h+=`<div><div class="label">Falta</div><div class="mono" style="font-size:22px;font-weight:800;line-height:1.5;color:${Math.abs(diff)<0.15?'var(--emerald)':'var(--amber-250)'}">${diff>0?"+":""}${diff.toFixed(1)}<small style="font-size:12px;color:var(--zinc-600)"> kg</small></div></div>`;}
  }
  h+=`</div>`;
  if(g&&cur!=null&&g.startKg!=null&&g.target!==g.startKg){
    const p=Math.max(0,Math.min(100,Math.round((cur-g.startKg)/(g.target-g.startKg)*100)));
    h+=`<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px"><div class="bar"><i style="width:${p}%"></i></div><div class="mono muted" style="font-size:12px;min-width:34px;text-align:right">${p}%</div></div>`;
  }
  h+=sparkline(logs.map(l=>l.kg));
  if(g&&g.startKg!=null&&cur!=null&&logs.length>=1){
    const wk=weeksBetween(g.startDate,logs[logs.length-1].date);
    const expected=g.startKg+parseFloat(g.rate)*wk;
    const delta=cur-expected, dir=parseFloat(g.rate);
    let status,color;
    if(Math.abs(delta)<=0.6){status="Vas en línea con tu meta";color="var(--emerald)";}
    else if((dir>=0&&delta>0)||(dir<0&&delta<0)){status="Vas adelantado a lo esperado";color="var(--sky)";}
    else{status="Vas un poco atrasado";color="var(--amber-250)";}
    h+=`<div style="margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--sup);border:1px solid var(--brd)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="label">Esperado hoy · ${RATE_LABEL[g.rate]||g.rate}</span>
        <span class="mono" style="font-weight:800;color:var(--zinc-200)">${expected.toFixed(1)} kg</span></div>
      <div style="margin-top:6px;color:${color};font-weight:700;font-size:13px">${status}</div></div>`;
  }
  h+=`</div>`;
  return h;
}
/* ---------- Fuerza por ejercicio (rediseño v2) ----------

function strengthBlock(){

  ids.forEach(id=>{

    const logs=byEx[id].slice().sort((a,b)=>a.date<b.date?-1:1);
    const first=logs[0],last=logs[logs.length-1];
    const chg=+(last.weight-first.weight).toFixed(1);
    h+=`<div class="card" style="padding:15px;margin-bottom:9px">

          <div class="ex-meta">${e.group} · ${logs.length} sesi${logs.length>1?'ones':'ón'} · desde ${fechaCorta(first.date)}</div></div>

          <div class="mono" style="font-size:11px;font-weight:700;color:${chg>0?'var(--emerald)':chg<0?'var(--rose)':'var(--zinc-500)'}">${chg>0?"▲ +"+chg:chg<0?"▼ "+chg:"sin cambio"}${chg!==0?" "+LB:""}</div></div>
      </div>
      ${logs.length>1?`<div style="margin-top:4px">${sparkline(logs.map(l=>l.weight),"#34d399")}</div>`:""}
    </div>`;
  });
  h+=`</div>`;
  h+=`<div style="margin-top:6px;padding:12px 14px;border-radius:12px;background:rgba(52,211,153,.05);border:1px solid rgba(52,211,153,.2)"><p class="sub" style="font-size:12px"><b style="color:#fff">Ritmo natural esperado:</b> ~5 ${LB} cada 2-3 semanas en compuestos (banca, sentadilla, peso muerto) y más lento en aislamientos. Si el rango de repeticiones se te queda corto, sube el peso.</p></div>`;
  return h;
}

/* ============================================================
   VISTA: CALENDARIO  (era "Progreso")
   ============================================================
   "Progreso" era un nombre tan vago que acabó recogiendo seis cosas distintas: asistencia, peso
   corporal, medidas, fuerza, volumen y el respaldo. Al llamarla Calendario queda obligada a
   hacer una sola cosa. Lo que es del cuerpo —peso, medidas— y el respaldo se fueron al Perfil. */
function renderCalendario(){
  let h=`<div class="view-head"><div class="label">Tu constancia</div><div class="h1" style="margin-top:2px">Calendario</div>
    <div class="sub" style="margin-top:4px">Toca cualquier día para marcarlo. Los de descanso ya vienen puestos por tu rutina.</div></div>`;

  h+=strengthBlock();
  h+=`<div class="label-mono section-gap" style="margin-bottom:10px">Volumen semanal · rutina activa</div>`;
  h+=volumeBlock();
  $("#v-calendario").innerHTML=h;
  bindCalendario();
}

/* ---------- Medidas corporales ----------
   9 zonas, las pares por lado: la asimetría entre brazos o piernas es justo
   lo que hay que vigilar y un promedio la escondería. Todo en cm.
   Convención del diagrama: es la vista frontal de la persona, así que su lado
   IZQUIERDO aparece a la derecha de la pantalla (como al mirarla de frente). */
const MEASURES=[
  ["hombro","Hombro"],
  ["pecho","Pecho"],
  ["biceps_izq","Bíceps izq."],
  ["biceps_der","Bíceps der."],
  ["cintura","Cintura"],
  ["muslo_izq","Muslo izq."],
  ["muslo_der","Muslo der."],
  ["pantorrilla_izq","Pantorrilla izq."],
  ["pantorrilla_der","Pantorrilla der."],
];
const MZ_TIP={
  hombro:"Contorno por la parte más ancha de los deltoides, de pie y con los brazos relajados a los lados.",
  pecho:"A la altura de los pezones, al final de una exhalación normal. No infles el pecho.",
  biceps_izq:"Brazo flexionado y contraído, en el punto más grueso.",
  biceps_der:"Brazo flexionado y contraído, en el punto más grueso.",
  cintura:"A la altura del ombligo, de pie y relajado. No metas el abdomen.",
  muslo_izq:"De pie, a 15 cm por encima de la rótula, con el peso repartido en las dos piernas.",
  muslo_der:"De pie, a 15 cm por encima de la rótula, con el peso repartido en las dos piernas.",
  pantorrilla_izq:"De pie, en el punto más grueso de la pantorrilla.",
  pantorrilla_der:"De pie, en el punto más grueso de la pantorrilla.",
};
/* Zonas donde crecer es bueno; en la cintura es al revés (por eso el color se invierte) */
const MZ_LOWER_IS_BETTER={cintura:true};
let selMZ=null; // zona resaltada en el diagrama
let mzOpen=false; // la tarjeta de medidas arranca plegada; se abre al tocar la cabecera
function measureSeries(k){
  return (S.measures||[]).filter(l=>l[k]!=null).sort((a,b)=>a.date<b.date?-1:1);
}
/* Diagrama tocable. `vals` decide qué zonas salen ya registradas, `sel` cuál se alumbra.
   Los <rect class="mzhit"> son transparentes y van al final: agrandan el área de toque

function bodyMeasureSVG(vals,sel,cls){

    <rect class="${c('muslo_der')}" data-mz="muslo_der" x="34" y="67" width="5.4" height="26" rx="2.7"/>
    <rect class="${c('muslo_izq')}" data-mz="muslo_izq" x="40.6" y="67" width="5.4" height="26" rx="2.7"/>
    <rect class="${c('pantorrilla_der')}" data-mz="pantorrilla_der" x="34.3" y="102" width="4.8" height="17" rx="2.4"/>
    <rect class="${c('pantorrilla_izq')}" data-mz="pantorrilla_izq" x="40.9" y="102" width="4.8" height="17" rx="2.4"/>
    ${hit('hombro',17,21,46,8)}${hit('pecho',30,29,20,11)}

/* Resumen de una línea para la cabecera plegada: lo único que se ve con la tarjeta cerrada,
   así que carga el aviso de "toca medirte" en ámbar cuando corresponde. */
function measureSummary(n){
  const st=measureStatus();
  if(st.state==="first")return {due:true,txt:"Sin medidas todavía · toma las de partida"};
  if(st.state==="due")return {due:true,txt:`Toca medirte · última <b>${fechaCorta(st.last)}</b>`};
  return {due:false,txt:`Última: <b>${fechaCorta(st.last)}</b> · ${n} de ${MEASURES.length} zonas`};
}
function measuresBlock(){
  const logs=(S.measures||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const last={};
  MEASURES.forEach(([k])=>{const s=measureSeries(k);if(s.length)last[k]=s[s.length-1][k];});
  const sum=measureSummary(Object.keys(last).length);
  let h=`<div class="card section-gap" style="padding:18px">
    <div class="fold-head${mzOpen?" open":""}" id="mzFold">
      <div style="flex:1;min-width:0">
        <div class="h3">Medidas corporales</div>
        <div class="fold-sum${sum.due?" due":""}">${sum.txt}</div>
      </div>
      <span class="fold-x">${IC.chevron}</span>
    </div>
    <div class="fold-body${mzOpen?" open":""}" id="mzBody"><div>
    <div class="bmap-wrap">${bodyMeasureSVG(last,selMZ)}</div>
    <p class="muted" style="text-align:center;margin:0 0 4px;font-size:11px">Toca un músculo para registrar · cambio vs. primera toma</p>
    <div class="mz-grid">`;
  MEASURES.forEach(([k,label])=>{
    const s=measureSeries(k);
    const v=s.length?s[s.length-1][k]:null;
    const d=s.length>=2?+(v-s[0][k]).toFixed(1):null;
    let col="var(--zinc-600)";
    if(d!==null){
      const bien=MZ_LOWER_IS_BETTER[k]?d<0:d>0;
      col=d===0?"var(--zinc-500)":bien?"var(--emerald)":"var(--sky)";
    }
    h+=`<div class="mztile${v==null?" empty":" has"}${selMZ===k?" on":""}" data-mz="${k}">
      <span class="mzl">${label}</span>
      <span class="mzv mono">${v==null?"—":v+'<small> cm</small>'}</span>
      <span class="mzd" style="color:${col}">${v==null?"sin registro":d===null?"primera toma":`${d>0?"+":""}${d} cm`}</span>
    </div>`;
  });
  h+=`</div>${measureNote()}
    <div style="display:flex;gap:8px;margin-top:12px">
      ${logs.length?`<button class="btn-secondary" id="histMeasure" style="flex:1;padding:9px 13px">Historial</button>`:``}
      <button class="btn-secondary" id="logMeasure" style="flex:1;padding:9px 13px">Todas</button>
    </div>
    </div></div></div>`;
  return h;
}
/* ---------- Cuándo volver a medirse (se deriva de la meta, no guarda nada) ----------
   Cuanto más agresivo es el ritmo de la meta, antes cambian las medidas: con ±0.5 kg/sem
   dos semanas ya dan diferencia medible; manteniendo peso hay que esperar un mes. */
const MEASURE_EVERY={"0.5":14,"-0.5":14,"0.25":21,"-0.25":21,"0":28};
const MEASURE_DEFAULT_DAYS=21;
function isoToDate(iso){const p=String(iso).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function diasEntre(a,b){return Math.round((isoToDate(b)-isoToDate(a))/864e5);}
function addDaysIso(iso,n){const d=isoToDate(iso);d.setDate(d.getDate()+n);return isoOf(d);}
function measurePlan(){
  const g=S.weightGoal;
  const rate=g&&g.rate!=null?String(g.rate):(S.profile?goalRateFromNutrition():null);
  const days=(rate!=null&&MEASURE_EVERY[rate])||MEASURE_DEFAULT_DAYS;
  return {days,rate,why:rate!=null?RATE_LABEL[rate]:null};
}
function measureStatus(){
  const p=measurePlan();
  const fechas=(S.measures||[]).map(l=>l.date).sort();
  const last=fechas.length?fechas[fechas.length-1]:null;
  if(!last)return Object.assign(p,{state:"first",last:null});
  const passed=diasEntre(last,todayKey());
  const left=p.days-passed;
  return Object.assign(p,{state:left<=0?"due":"ok",last,passed,left,next:addDaysIso(last,p.days)});
}
function measureNote(){
  const st=measureStatus();
  const sem=st.days%7===0?`${st.days/7} ${st.days/7===1?"semana":"semanas"}`:`${st.days} días`;
  const motivo=st.why?`Según tu meta (<b>${st.why}</b>) toca cada <b>${sem}</b>.`
                     :`Sin meta de peso definida se usa el intervalo por defecto: cada <b>${sem}</b>.`;
  let cls="",txt="";
  if(st.state==="first"){txt=`<b>Aún no has tomado medidas.</b> Tómalas hoy para tener punto de partida. ${motivo}`;}
  else if(st.state==="due"){cls=" due";txt=`<b>Toca medirte.</b> La última fue hace ${st.passed} ${st.passed===1?"día":"días"} (${fechaCorta(st.last)}). ${motivo}`;}
  else{cls=" ok";txt=`Próxima toma: <b>${fechaCorta(st.next)}</b> · ${st.left===0?"hoy":`en ${st.left} ${st.left===1?"día":"días"}`}. ${motivo}`;}
  const ico=st.state==="due"?"var(--amber)":st.state==="first"?"var(--zinc-500)":"var(--emerald)";
  return `<div class="mz-note${cls}">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${ico}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex:none;margin-top:1px"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4M12 13v3.5"/></svg>
    <p class="sub" style="margin:0;font-size:11.5px;line-height:1.5">${txt}</p></div>`;
}
/* Hoja de una sola zona: se abre al tocar el músculo en el diagrama */
function openMeasureZone(k){

      </div>
    </div>
    <div class="field"><label>Medida de hoy (cm)</label><input type="number" inputmode="decimal" id="mz-val" value="${cur!=null?cur:""}" placeholder="${prev?prev[k]:'cm'}"></div>
    <div style="display:flex;gap:8px">
      ${cur!=null?`<button class="btn-secondary" id="mz-del">Quitar</button>`:``}
      <button class="btn-primary" style="flex:1" id="mz-save">Guardar</button>
    </div>`);

    entry[k]=v;

    save();closeSheet2();toast("Medida quitada");

/* Hoja con las 9 zonas de una vez (para la toma completa) */
function measureFields(pre,vals,phs){
  let f="";
  for(let i=0;i<MEASURES.length;i+=2){

function openMeasureSheet(){

    ${measureFields("m-",hoy,phs)}

  };
}

/* ---------- Historial de peso y medidas ----------
   Hojas de consulta con corrección: listan cada registro (más reciente arriba),
   la diferencia contra el registro anterior, y permiten editar o borrar un día. */

/* El punto de partida de la meta se toma del registro más antiguo. Si se corrige o
   borra ese primer registro, la proyección quedaría anclada a un dato que ya no existe;
   por eso se recalcula tras cada edición. */
function syncGoalStart(){
  const g=S.weightGoal;if(!g)return;
  const logs=(S.weightLog||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!logs.length){g.startKg=null;g.startDate=null;return;}
  g.startKg=logs[0].kg;g.startDate=logs[0].date;
}

function openWeightHistory(){
  const logs=(S.weightLog||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(!logs.length)return;
  const first=logs[0],last=logs[logs.length-1];
  const total=+(last.kg-first.kg).toFixed(1);
  const dias=Math.round((new Date(last.date)-new Date(first.date))/864e5);
  let rows="";
  for(let i=logs.length-1;i>=0;i--){
    const l=logs[i],prev=i>0?logs[i-1]:null;
    const d=prev?+(l.kg-prev.kg).toFixed(1):null;
    rows+=`<div class="hrow">
      <div class="hd">${fechaCorta(l.date)}</div>
      <div class="hv mono">${l.kg.toFixed(1)}<small style="font-size:11px;color:var(--zinc-500);font-weight:700"> kg</small></div>
      <div class="hg mono">${d===null?`<span class="dim">primero</span>`:`${d>0?"+":""}${d}`}</div>
      <div class="ha">
        <button class="icon-btn" style="width:30px;height:30px" data-hedit="${l.date}" title="Corregir">${IC.pencil}</button>
        <button class="icon-btn" style="width:30px;height:30px" data-hdel="${l.date}" title="Eliminar">${IC.trash}</button>
      </div></div>`;
  }
  openSheet(`<div class="sheet-grab"></div>
    <div class="sheet-head"><div class="h2">Historial de peso</div><button class="close-x" data-close>×</button></div>
    <p class="muted" style="margin:2px 0 14px">${logs.length} registro${logs.length===1?"":"s"}${dias>0?` · ${dias} día${dias===1?"":"s"} · ${total>0?"+":""}${total} kg en total`:""}</p>
    <div>${rows}</div>`);
  $("#sheet").querySelectorAll("[data-hedit]").forEach(b=>b.onclick=()=>editWeightEntry(b.dataset.hedit));

/* ---------- La consecuencia del CTA (etapa 3 del rediseño v2) ----------
   El problema que resuelve: el botón "Entrené" vive en Hoy, pero su efecto —el día encendido, la
   racha, el porcentaje del mes— vive en el Calendario, que no está en pantalla. Sin esto, la
   acción más importante de la app se siente como pulsar y que no pase nada.

   Reparto de tiempos de la §17: la pulsación ya se resolvió (140ms, es respuesta a un gesto) y
   aquí corren las consecuencias en ~400ms decelerando. Se repinta la tira SOLA, no la vista
   entera: un `renderHoy()` completo destruiría el nodo del punto y la animación no tendría de
   dónde partir — el mismo motivo por el que el dock separa montarDock() de renderDock(). */
/* Envuelve un cambio de vista en una View Transition cuando el navegador la trae. Sin soporte
   —o con movimiento reducido— ejecuta el cambio tal cual: la app nunca depende de la animación
   para funcionar. */
function conTransicion(fn){
  const reducido=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reducido||!document.startViewTransition)return fn();
  document.startViewTransition(fn);
}

/* ---------- Reglas de un hábito ---------- */
function vdDia(iso){return (isoToDate(iso).getDay()+6)%7;}            // 0 = lunes
function vdLunes(iso){return addDaysIso(iso,-vdDia(iso));}
function vdHabitos(){return vida().habits.filter(h=>!h.archived);}
function vdBuscar(id){return vida().habits.find(h=>h.id===id);}
function vdSemanal(h){return (h.freq||{}).type==="weekly";}
function vdValor(h,iso){const d=vida().log[iso];return d&&d[h.id]||0;}
function vdMeta(h){return h.kind==="count"?Math.max(1,+h.target||1):1;}
function vdHecho(h,iso){return vdValor(h,iso)>=vdMeta(h);}
/* Antes de crearse, un hábito no "tocaba": esos días no cuentan como fallados. Un día viejo
   que sí tiene valor (se marcó hacia atrás) cuenta igual. */
function vdNacio(h,iso){return !h.created||iso>=h.created||vdValor(h,iso)>0;}
function vdToca(h,iso){
  if(!vdNacio(h,iso))return false;
  const f=h.freq||{};
  if(f.type==="days")return (f.days||[]).includes(vdDia(iso));
  return true;
}
function vdVecesSemana(h,iso){const l=vdLunes(iso);let n=0;for(let i=0;i<7;i++)if(vdHecho(h,addDaysIso(l,i)))n++;return n;}
function vdPoner(h,iso,v){
  const L=vida();v=Math.max(0,+v||0);
  if(!L.log[iso])L.log[iso]={};
  if(v>0)L.log[iso][h.id]=v;
  else{delete L.log[iso][h.id];if(!Object.keys(L.log[iso]).length)delete L.log[iso];}
  save();
}
/* Racha: los días que no tocan ni suman ni rompen; hoy sin marcar todavía no rompe (si no, la
   racha amanecería en cero cada mañana). Los hábitos semanales cuentan semanas cumplidas. */
function vdRacha(h){
  const hoy=todayKey();
  if(vdSemanal(h)){
    const t=h.freq.times||1;let l=vdLunes(hoy),n=0;
    if(vdVecesSemana(h,l)>=t)n++;
    l=addDaysIso(l,-7);
    while(n<520&&vdVecesSemana(h,l)>=t){n++;l=addDaysIso(l,-7);}
    return {n,u:n===1?"semana":"semanas"};
  }
  let n=0,iso=hoy;
  for(let g=0;g<3660;g++){
    if(!vdNacio(h,iso))break;
    if(vdToca(h,iso)){if(vdHecho(h,iso))n++;else if(iso!==hoy)break;}
    iso=addDaysIso(iso,-1);
  }
  return {n,u:n===1?"día":"días"};
}
function vdInicio(h){
  let s=h.created||todayKey();const log=vida().log;
  for(const iso in log)if(iso<s&&log[iso][h.id])s=iso;
  return s;
}
function vdMejor(h){
  const hoy=todayKey();let best=0,cur=0;
  if(vdSemanal(h)){
    const t=h.freq.times||1,lh=vdLunes(hoy);
    for(let l=vdLunes(vdInicio(h));l<=lh;l=addDaysIso(l,7)){
      if(vdVecesSemana(h,l)>=t){cur++;best=Math.max(best,cur);}else if(l!==lh)cur=0;
    }
    return best;
  }
  for(let iso=vdInicio(h);iso<=hoy;iso=addDaysIso(iso,1)){
    if(!vdToca(h,iso))continue;
    if(vdHecho(h,iso)){cur++;best=Math.max(best,cur);}else if(iso!==hoy)cur=0;
  }
  return best;
}
/* Fracción cumplida entre a y b. Hoy solo entra si ya se hizo (no se castiga lo que aún puede
   pasar); la semana en curso de un hábito semanal, igual. Null = no tocaba nada. */
function vdPct(h,a,b){
  const hoy=todayKey();if(b>hoy)b=hoy;
  if(a>b)return null;
  if(vdSemanal(h)){
    const t=h.freq.times||1,lh=vdLunes(hoy),ini=vdInicio(h);let s=0,m=0;
    for(let l=vdLunes(a);l<=b;l=addDaysIso(l,7)){
      if(addDaysIso(l,6)<ini)continue;
      const v=Math.min(vdVecesSemana(h,l),t);
      if(l===lh&&v<t)continue;
      s+=v;m+=t;
    }
    return m?s/m:null;
  }
  let s=0,d=0;
  for(let iso=a;iso<=b;iso=addDaysIso(iso,1)){
    if(!vdToca(h,iso))continue;
    if(iso===hoy&&!vdHecho(h,iso))continue;
    d++;if(vdHecho(h,iso))s++;
  }
  return d?s/d:null;
}
/* Cumplimiento de un día: solo los hábitos diarios y de días fijos, que son los que tienen una
   respuesta clara para ESE día. Los semanales se miden por semana. */
function vdPctDia(iso){
  const hs=vdHabitos().filter(h=>!vdSemanal(h)&&vdToca(h,iso));
  if(!hs.length)return null;
  return hs.filter(h=>vdHecho(h,iso)).length/hs.length;
}
function vdPctRango(a,b){
  const ps=vdHabitos().map(h=>vdPct(h,a,b)).filter(p=>p!=null);
  return ps.length?ps.reduce((x,y)=>x+y,0)/ps.length:null;
}
/* Lo que aparece en Hoy: lo que toca hoy, y los semanales mientras falten veces en la semana
   (o si ya se registró algo hoy, para poder corregirlo). */
function vdLista(iso){
  return vdHabitos().filter(h=>{
    if(vdSemanal(h))return vdVecesSemana(h,iso)<(h.freq.times||1)||vdValor(h,iso)>0;
    return vdToca(h,iso);
  });
}
function vdFreqTxt(h){
  const f=h.freq||{};
  if(f.type==="days")return (f.days||[]).slice().sort((a,b)=>a-b).map(i=>VD_DIAS[i]).join(" ");
  if(f.type==="weekly")return `${f.times} ${f.times===1?"vez":"veces"} por semana`;
  return "Todos los días";
}
function vdMetaTxt(h,iso){
  const r=vdRacha(h),p=[];
  if(h.kind==="count")p.push(`${fmtN(vdValor(h,iso))} de ${fmtN(vdMeta(h))} ${escH(h.unit||"")}`.trim());
  if(vdSemanal(h))p.push(`${vdVecesSemana(h,iso)} de ${h.freq.times} esta semana`);
  if(r.n>0)p.push(`<b>Racha ${r.n} ${r.u}</b>`);
  else if(!p.length)p.push(vdFreqTxt(h));
  return p.join(" · ");
}

/* ---------- Piezas ---------- */
function vdFila(h,iso){
  const ok=vdHecho(h,iso);
  return `<div class="vd-row${ok?" done":""}" data-h="${h.id}" style="--hc:var(--c-${h.color||"emerald"})">
    <div class="vd-ico">${icoVida(h.icon)}</div>
    <div class="vd-body" data-editar="${h.id}"><div class="vd-name">${escH(h.name)}</div><div class="vd-meta">${vdMetaTxt(h,iso)}</div></div>
    ${h.kind==="count"?`<button class="vd-cnt" data-cant="${h.id}" aria-label="Registrar cantidad"><span class="v">${fmtCorto(vdValor(h,iso))}</span><span class="m">/${fmtCorto(vdMeta(h))}</span></button>`:""}
    <button class="vd-chk" data-marcar="${h.id}" aria-label="Marcar ${escH(h.name)}" aria-pressed="${ok}">${VD_CHK}</button>
  </div>`;
}
const VD_R=32,VD_C=2*Math.PI*VD_R;
function vdAnillo(f){
  return `<div class="vd-ring"><svg viewBox="0 0 76 76" aria-hidden="true">
    <circle class="tr" cx="38" cy="38" r="${VD_R}" fill="none" stroke-width="7"/>
    <circle class="pr" id="vdAnillo" cx="38" cy="38" r="${VD_R}" fill="none" stroke-width="7" stroke-linecap="round"
      stroke-dasharray="${VD_C.toFixed(2)}" stroke-dashoffset="${(VD_C*(1-f)).toFixed(2)}" style="opacity:${f>0?1:0}"/></svg>
    <div class="rv" id="vdAnilloV">${Math.round(f*100)}%</div></div>`;
}
function vdHeroTxt(n,t){return !t?"Hoy no toca ningún hábito":n>=t?"Día completo":`${n} de ${t} hábitos`;}
function vdHeroSub(){
  let best=null;
  vdHabitos().forEach(h=>{const r=vdRacha(h);if(r.n>0&&(!best||r.n>best.r.n))best={h,r};});
  return best?`Mejor racha activa: ${escH(best.h.name)}, ${best.r.n} ${best.r.u}`:"Marca cada hábito en cuanto lo cumplas.";
}
function vdVacio(){
  return `<div class="card vd-empty">
    <div class="h3">Crea tu primer hábito</div>
    <p class="sub" style="margin:6px 0 2px">Empieza con dos o tres. Toca una idea para agregarla tal cual, o crea uno a tu medida.</p>
    <div class="fchips">${VD_IDEAS.map((x,i)=>`<button class="fchip" data-idea="${i}">${x.name}</button>`).join("")}</div>
    <button class="btn-primary" data-nuevo="1">Crear hábito</button></div>`;
}
function vdAgregarIdea(i){
  const x=VD_IDEAS[i];if(!x)return;
  if(vdHabitos().some(h=>h.name===x.name))return toast("Ese hábito ya está en tu lista");
  vida().habits.push(Object.assign(structuredClone(x),{id:uid(),created:todayKey(),archived:false}));
  save();toast("Hábito agregado");vdRefrescar();
}
function vdCheckin(iso){
  const m=vida().moods[iso]||{};
  return `<div class="card section-gap" style="padding:16px">
    <div class="h3" style="font-size:14px">¿Cómo va tu día?</div>
    <div class="vd-moods">${[1,2,3,4,5].map(i=>`<button class="vd-mood${m.m===i?" on":""}" data-animo="${i}" style="--hc:var(--c-${VD_ANIMO[i].c})" aria-pressed="${m.m===i}"><span class="md"></span><span class="ml">${VD_ANIMO[i].n}</span></button>`).join("")}</div>
    <div class="field" style="margin:12px 0 0"><textarea id="vdNota" rows="2" maxlength="280" placeholder="Una línea sobre hoy (opcional)">${escH(m.note||"")}</textarea></div>
  </div>`;
}
function vdPrioridades(iso){
  const p=vida().prio[iso]||[];let r="";
  for(let i=0;i<3;i++){
    const x=p[i]||{t:"",d:false};
    r+=`<div class="vd-prio${x.d?" done":""}" data-pi="${i}"><span class="n">${i+1}</span>
      <input type="text" maxlength="80" value="${escH(x.t)}" placeholder="${i===0?"Lo más importante de hoy":"Otra prioridad"}" data-pt="${i}" aria-label="Prioridad ${i+1}">
      <button class="vd-chk" data-pd="${i}" aria-label="Prioridad ${i+1} hecha">${VD_CHK}</button></div>`;
  }
  return `<div class="card section-gap" style="padding:12px 16px"><div class="h3" style="font-size:14px;margin:4px 0 2px">Tres prioridades</div>${r}</div>`;
}
/* Puente con el módulo Cuerpo: la marca de "Entrené" es la MISMA de su calendario (S.days), no un
   hábito aparte. Dos verdades sobre el mismo hecho terminarían contradiciéndose. */
function vdCuerpoCard(iso){
  const day=activeRoutine().days[jsDayToId()],e=dayState(iso);
  const desc=!day||day.rest||!day.exercises.length;
  const marcado=e==="entrenado"||e==="libre";
  const estado=marcado?(e==="libre"?"Entrenaste por fuera":"Entrenado"):desc?"Día de recuperación":`${day.exercises.length} ejercicios en la rutina`;
  return `<div class="card section-gap tap" id="vdCuerpo" style="padding:14px 15px;display:flex;align-items:center;gap:12px;--hc:var(--c-sky)">
    <div class="vd-ico">${icoVida("pesa")}</div>
    <div class="vd-body"><div class="label">Cuerpo · hoy</div><div class="vd-name" style="margin-top:2px">${escH(desc?"Descanso":day.focus)}</div><div class="vd-meta">${estado}</div></div>
    ${desc&&!marcado?"":`<button class="${marcado?"btn-secondary":"btn-primary"} vd-mini" id="vdEntrene">${marcado?"Quitar":"Entrené"}</button>`}
  </div>`;
}
function vdSaludo(){const h=new Date().getHours();return h<12?"Buenos días":h<19?"Buenas tardes":"Buenas noches";}

/* ============================================================
   VISTA: HOY (panel de vida)
   ============================================================ */
function renderInicio(){
  const hoy=todayKey(),d=new Date();
  let h=`<div class="view-head"><div class="label">${DAYNAME[jsDayToId()]} · ${d.getDate()} de ${MESES_LARGO[d.getMonth()].toLowerCase()}</div>
    <div class="h1" style="margin-top:2px">${vdSaludo()}</div></div>`;
  if(!vdHabitos().length)h+=vdVacio();
  else{
    const lista=vdLista(hoy),n=lista.filter(x=>vdHecho(x,hoy)).length;
    h+=`<div class="card vd-hero">${vdAnillo(lista.length?n/lista.length:0)}
      <div style="min-width:0"><div class="h3" id="vdHeroT">${vdHeroTxt(n,lista.length)}</div>
      <div class="sub" id="vdHeroS" style="font-size:12px;margin-top:3px">${vdHeroSub()}</div></div></div>`;
    h+=`<div class="section-gap"><div class="card-head" style="margin-bottom:10px"><div class="label">Hábitos de hoy</div>
      <div class="acts"><button class="btn-secondary vd-mini" data-nuevo="1">+ Nuevo</button></div></div>
      <div class="list-stagger">${lista.map(x=>vdFila(x,hoy)).join("")||`<p class="sub">Hoy no toca ninguno de tus hábitos.</p>`}</div></div>`;
  }
  h+=vdCheckin(hoy)+vdPrioridades(hoy)+vdCuerpoCard(hoy);
  $("#v-inicio").innerHTML=h;
  bindInicio();
}
let vdTNota=null,vdTPrio=null;
function bindInicio(){
  const v=$("#v-inicio"),hoy=todayKey();
  v.onclick=e=>{
    const t=e.target.closest("[data-marcar],[data-cant],[data-editar],[data-animo],[data-pd],[data-idea],[data-nuevo],#vdEntrene,#vdCuerpo");
    if(!t)return;
    if(t.dataset.marcar)return vdAlternar(t.dataset.marcar,hoy);
    if(t.dataset.cant)return vdHojaCantidad(t.dataset.cant,hoy);
    if(t.dataset.editar)return vdHojaHabito(t.dataset.editar);
    if(t.dataset.idea!==undefined)return vdAgregarIdea(+t.dataset.idea);
    if(t.dataset.nuevo)return vdHojaHabito();
    if(t.dataset.animo){
      const L=vida(),i=+t.dataset.animo,m=L.moods[hoy]||{};
      m.m=m.m===i?undefined:i;
      if(!m.m&&!m.note)delete L.moods[hoy];else L.moods[hoy]=m;
      save();
      v.querySelectorAll("[data-animo]").forEach(b=>{const on=+b.dataset.animo===m.m;b.classList.toggle("on",on);b.setAttribute("aria-pressed",on);});
      return;
    }
    if(t.dataset.pd!==undefined){
      const i=+t.dataset.pd,p=vdPrioArr(hoy);
      if(!p[i].t.trim())return toast("Escribe la prioridad primero");
      p[i].d=!p[i].d;vdGuardarPrio(hoy);
      t.closest(".vd-prio").classList.toggle("done",p[i].d);
      return;
    }
    if(t.id==="vdEntrene"){
      const e2=dayState(hoy);
      if(e2==="entrenado"||e2==="libre")desmarcarDia(hoy);else marcarEntrenado(hoy);
      $("#vdCuerpo").outerHTML=vdCuerpoCard(hoy);
      return;
    }
    if(t.id==="vdCuerpo")go("hoy");
  };
  const nota=$("#vdNota");
  if(nota){
    const guardar=()=>{const L=vida(),m=L.moods[hoy]||{};m.note=nota.value.trim();
      if(!m.m&&!m.note)delete L.moods[hoy];else L.moods[hoy]=m;save();};
    nota.oninput=()=>{clearTimeout(vdTNota);vdTNota=setTimeout(guardar,400);};
    nota.onblur=()=>{clearTimeout(vdTNota);guardar();};
  }
  v.querySelectorAll("[data-pt]").forEach(inp=>{
    const guardar=()=>{vdPrioArr(hoy)[+inp.dataset.pt].t=inp.value;vdGuardarPrio(hoy);};
    inp.oninput=()=>{clearTimeout(vdTPrio);vdTPrio=setTimeout(guardar,400);};
    inp.onblur=()=>{clearTimeout(vdTPrio);guardar();};
    inp.onkeydown=e=>{if(e.key==="Enter")inp.blur();};
  });
}
function vdPrioArr(iso){
  const L=vida();const p=L.prio[iso]||[];
  for(let i=0;i<3;i++)p[i]=p[i]||{t:"",d:false};
  L.prio[iso]=p;return p;
}
function vdGuardarPrio(iso){
  const L=vida(),p=L.prio[iso]||[];
  p.forEach(x=>{if(!x.t.trim())x.d=false;});
  if(!p.some(x=>x.t.trim()))delete L.prio[iso];
  save();
}

/* ---------- Marcar sin re-renderizar ----------
   Regla de la casa (v1.13.0): un toque durante el uso NUNCA reconstruye la vista. Se tocan solo
   los nodos que muestran ese hábito, para que el scroll no salte y la animación del cambio se vea. */
function vdAlternar(id,iso){
  const h=vdBuscar(id);if(!h||iso>todayKey())return;
  const ok=vdHecho(h,iso);
  vdPoner(h,iso,ok?0:vdMeta(h));
  if(!ok&&navigator.vibrate){try{navigator.vibrate(10);}catch(_){}}
  vdRepintar(h,iso);
}
function vdRepintar(h,iso){
  const hoy=todayKey();
  document.querySelectorAll(`.vd-row[data-h="${h.id}"]`).forEach(r=>{
    const ok=vdHecho(h,iso);
    r.classList.toggle("done",ok);
    const c=r.querySelector(".vd-chk");if(c)c.setAttribute("aria-pressed",ok);
    const m=r.querySelector(".vd-meta");if(m)m.innerHTML=vdMetaTxt(h,iso);
    const cv=r.querySelector(".vd-cnt .v");if(cv)cv.textContent=fmtCorto(vdValor(h,iso));
  });
  if(iso===hoy&&$("#vdAnillo")){
    const lista=vdLista(hoy),n=lista.filter(x=>vdHecho(x,hoy)).length,f=lista.length?n/lista.length:0;
    const a=$("#vdAnillo");a.style.opacity=f>0?1:0;a.setAttribute("stroke-dashoffset",(VD_C*(1-f)).toFixed(2));
    $("#vdAnilloV").textContent=Math.round(f*100)+"%";
    $("#vdHeroT").textContent=vdHeroTxt(n,lista.length);
    $("#vdHeroS").innerHTML=vdHeroSub();
  }
  // Celdas: en la vista Semana la fecha puede ser la de cualquier día de la semana visible
  const lunVis=vdLunes(iso);
  document.querySelectorAll(`.vd-cell[data-c="${h.id}|${iso}"]`).forEach(el=>{
    const tmp=document.createElement("div");tmp.innerHTML=vdCelda(h,iso,el.dataset.n==="1");
    const nuevo=tmp.firstElementChild;el.className=nuevo.className;el.innerHTML=nuevo.innerHTML;
  });
  document.querySelectorAll(`[data-st="${h.id}"]`).forEach(el=>{el.textContent=vdStTxt(h,el.dataset.lun||lunVis);});
  document.querySelectorAll(`[data-ms="${h.id}"]`).forEach(el=>{el.innerHTML=vdStats3(h,el.dataset.a,el.dataset.b);});
  document.querySelectorAll(`[data-pf="${iso}"]`).forEach(el=>{const t=document.createElement("div");t.innerHTML=vdPie(iso);
    const n=t.firstElementChild;el.className=n.className;el.textContent=n.textContent;});
}
function vdHojaCantidad(id,iso){
  const h=vdBuscar(id);if(!h||iso>todayKey())return;
  const meta=vdMeta(h),paso=meta>=100?Math.round(meta/10):meta>=20?5:1;
  openSheet2(`<div class="sheet-grab"></div><div class="sheet-head"><div><div class="h2">${escH(h.name)}</div>
      <div class="sub" style="font-size:11px;margin-top:3px">${iso===todayKey()?"Hoy":fechaLarga(iso)} · meta ${fmtN(meta)} ${escH(h.unit||"")}</div></div>
      <button class="close-x" data-close>×</button></div>
    <div class="vd-step" style="margin:18px 0">
      <button class="icon-btn" id="vqMenos" aria-label="Restar ${paso}"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      <div class="field" style="flex:1;margin:0"><input type="number" inputmode="decimal" min="0" id="vqVal" value="${vdValor(h,iso)||""}" placeholder="0"></div>
      <button class="icon-btn" id="vqMas" aria-label="Sumar ${paso}">${IC.plus}</button></div>
    <div style="display:flex;gap:8px"><button class="btn-secondary" style="flex:1" id="vqMeta">Completar meta</button>
      <button class="btn-primary" style="flex:1" id="vqOk">Guardar</button></div>`);
  const inp=$("#vqVal");
  const fin=v=>{vdPoner(h,iso,v);closeSheet2();vdRepintar(h,iso);};
  $("#vqMenos").onclick=()=>{inp.value=Math.max(0,(+inp.value||0)-paso);};
  $("#vqMas").onclick=()=>{inp.value=(+inp.value||0)+paso;};
  $("#vqMeta").onclick=()=>fin(meta);
  $("#vqOk").onclick=()=>fin(+inp.value||0);
  inp.onkeydown=e=>{if(e.key==="Enter")fin(+inp.value||0);};
}

/* ---------- Editor de hábito ---------- */
function vdHojaHabito(id){
  const L=vida(),orig=id?vdBuscar(id):null;
  const dr=orig?structuredClone(orig):{name:"",icon:"check",color:"emerald",kind:"check",target:8,unit:"",freq:{type:"daily"}};
  dr.freq=Object.assign({type:"daily",days:[0,1,2,3,4],times:3},dr.freq);
  if(!dr.freq.days||!dr.freq.days.length)dr.freq.days=[0,1,2,3,4];
  if(!dr.target)dr.target=8;
  const ideas=orig?"":`<span class="vd-lbl" style="margin-top:10px">Ideas de un toque</span>
    <div class="fchips" style="margin:0">${VD_IDEAS.map((x,i)=>`<button class="fchip" data-vi="${i}">${x.name}</button>`).join("")}</div>`;
  openSheet(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">${orig?"Editar hábito":"Nuevo hábito"}</div>
    <button class="close-x" data-close>×</button></div>${ideas}<div id="vhCuerpo"></div>`);
  function pintar(){
    const f=dr.freq;

        <div class="field" style="margin:0"><label>Unidad</label><input type="text" maxlength="14" id="vhUni" value="${escH(dr.unit||"")}" placeholder="vasos, min, págs."></div></div>`:"";
    let extraFq="";
    if(f.type==="days")extraFq=`<div class="vd-dsel" style="margin-top:10px">${VD_DIAS.map((d,i)=>`<button data-dia="${i}" class="${f.days.includes(i)?"sel":""}" aria-pressed="${f.days.includes(i)}">${d}</button>`).join("")}</div>`;

  }
  pintar();
  $("#sheet").onclick=e=>{
    const t=e.target.closest("[data-vi],[data-ico],[data-col],[data-kind],[data-fq],[data-dia],[data-veces],#vhOk,#vhSubir,#vhArch,#vhDel");
    if(!t)return;
    const f=dr.freq;
    if(t.dataset.vi!==undefined){Object.assign(dr,structuredClone(VD_IDEAS[+t.dataset.vi]));dr.freq=Object.assign({days:[0,1,2,3,4],times:3},dr.freq);if(!dr.target)dr.target=8;pintar();return;}
    if(t.dataset.ico){dr.icon=t.dataset.ico;$("#vhCuerpo").querySelectorAll("[data-ico]").forEach(b=>b.classList.toggle("sel",b===t));return;}
    if(t.dataset.col){dr.color=t.dataset.col;$("#vhCuerpo").querySelectorAll("[data-col]").forEach(b=>b.classList.toggle("sel",b===t));
      $("#vhCuerpo .vd-icos").style.setProperty("--hc",`var(--c-${dr.color})`);return;}
    if(t.dataset.kind){dr.kind=t.dataset.kind;pintar();return;}
    if(t.dataset.fq){f.type=t.dataset.fq;pintar();return;}
    if(t.dataset.dia!==undefined){const i=+t.dataset.dia;f.days=f.days.includes(i)?f.days.filter(x=>x!==i):[...f.days,i];pintar();return;}
    if(t.dataset.veces){f.times=Math.min(6,Math.max(1,f.times+(+t.dataset.veces)));pintar();return;}
    if(t.id==="vhOk"){
      dr.name=(dr.name||"").trim();
      if(!dr.name)return toast("Ponle un nombre");
      if(dr.kind==="count"&&!(dr.target>0))return toast("La meta tiene que ser mayor que cero");
      if(f.type==="days"&&!f.days.length)return toast("Elige al menos un día");
      const limpio={name:dr.name,icon:dr.icon,color:dr.color,kind:dr.kind==="count"?"count":"check",
        freq:f.type==="days"?{type:"days",days:f.days.slice().sort((a,b)=>a-b)}:f.type==="weekly"?{type:"weekly",times:f.times}:{type:"daily"}};
      if(limpio.kind==="count"){limpio.target=dr.target;limpio.unit=(dr.unit||"").trim();}
      if(orig){["target","unit"].forEach(k=>delete orig[k]);Object.assign(orig,limpio);}
      else L.habits.push(Object.assign(limpio,{id:uid(),created:todayKey(),archived:false}));
      save();closeSheet();toast(orig?"Hábito actualizado":"Hábito creado");vdRefrescar();return;
    }
    if(t.id==="vhSubir"){
      const i=L.habits.indexOf(orig);
      let j=i-1;while(j>=0&&L.habits[j].archived!==orig.archived)j--;
      if(j<0)return toast("Ya es el primero");
      L.habits.splice(i,1);L.habits.splice(j,0,orig);save();toast("Subió un puesto");vdRefrescar();return;
    }
    if(t.id==="vhArch"){orig.archived=!orig.archived;save();closeSheet();toast(orig.archived?"Archivado: su historial se conserva":"Restaurado");vdRefrescar();return;}
    if(t.id==="vhDel"){
      confirmSheet({title:"Eliminar hábito",message:`Se borra «${escH(orig.name)}» con todo su historial. Si solo quieres dejarlo de ver, archívalo.`,cta:"Eliminar",danger:true,onConfirm:()=>{
        L.habits=L.habits.filter(x=>x!==orig);
        for(const iso in L.log){delete L.log[iso][orig.id];if(!Object.keys(L.log[iso]).length)delete L.log[iso];}
        save();closeSheet();toast("Hábito eliminado");vdRefrescar();
      }});
    }
  };
}
function vdHojaArchivados(){
  const arch=vida().habits.filter(x=>x.archived);
  openSheet(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">Archivados</div><button class="close-x" data-close>×</button></div>
    <p class="sub" style="font-size:12px;margin:4px 0 12px">No aparecen en Hoy ni en las estadísticas, pero conservan su historial.</p>
    ${arch.map(h=>`<div class="vd-row" style="--hc:var(--c-${h.color})"><div class="vd-ico">${icoVida(h.icon)}</div>

      <button class="btn-secondary vd-mini" data-rest="${h.id}">Restaurar</button></div>`).join("")}`);
  $("#sheet").onclick=e=>{const b=e.target.closest("[data-rest]");if(!b)return;
