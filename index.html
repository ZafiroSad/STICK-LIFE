/* Repinta la vista del panel que esté abierta (después de crear/editar, nunca durante un toque) */
function vdRefrescar(){
  if(curView==="inicio")renderInicio();
  else if(curView==="habitos")renderHabitos();
  else if(curView==="resumen")renderResumen();
}

/* ============================================================
   VISTA: HÁBITOS — semana y mes
   ============================================================ */
let vdModo="semana",vdSem=null,vdMes=null;
function vdCelda(h,iso,conNum){
  const hoy=todayKey(),v=vdValor(h,iso),ok=v>=vdMeta(h);
  let c="vd-cell";
  if(iso>hoy)c+=" fut";
  else if(ok)c+=" on";
  else if(v>0)c+=" part";
  else if(!vdToca(h,iso))c+=" off";
  else if(iso<hoy&&!vdSemanal(h))c+=" miss";
  if(iso===hoy)c+=" today";
  const inner=conNum?String(+iso.slice(8)):ok?VD_CHK:v>0?fmtCorto(v):"";
  return `<button class="${c}" data-c="${h.id}|${iso}"${conNum?' data-n="1"':""}${iso>hoy?" disabled":""} aria-label="${escH(h.name)}, ${fechaCorta(iso)}">${inner}</button>`;
}
function vdStTxt(h,lun){
  const hoy=todayKey();
  if(vdSemanal(h))return `${vdVecesSemana(h,lun)}/${h.freq.times}`;
  let d=0,t=0;
  for(let i=0;i<7;i++){const iso=addDaysIso(lun,i);if(iso>hoy||!vdToca(h,iso))continue;t++;if(vdHecho(h,iso))d++;}
  return `${d}/${t}`;
}
function vdPie(iso){
  const p=iso>todayKey()?null:vdPctDia(iso);
  return `<span data-pf="${iso}" class="${p===1?"full":""}">${p==null?"·":Math.round(p*100)+"%"}</span>`;
}
function vdStats3(h,a,b){
  const r=vdRacha(h),p=vdPct(h,a,b);
  return `<div><div class="v">${r.n}</div><div class="l">Racha</div></div>
    <div><div class="v">${vdMejor(h)}</div><div class="l">Mejor</div></div>
    <div><div class="v">${p==null?"–":Math.round(p*100)+"%"}</div><div class="l">Del mes</div></div>`;
}
function vdVistaSemana(hs){
  const hoy=todayKey(),lh=vdLunes(hoy),lun=vdSem&&vdSem<lh?vdSem:lh,act=lun===lh;
  let dias="";
  for(let i=0;i<7;i++){const iso=addDaysIso(lun,i);dias+=`<span class="${iso===hoy?"today":""}">${VD_DIAS[i]}<b>${+iso.slice(8)}</b></span>`;}
  let filas="";
  hs.forEach(x=>{
    let c="";for(let i=0;i<7;i++)c+=vdCelda(x,addDaysIso(lun,i),false);
    filas+=`<div class="vd-wrow" style="--hc:var(--c-${x.color})">
      <div class="vd-whead" data-editar="${x.id}"><div class="vd-ico">${icoVida(x.icon)}</div><div class="vd-name">${escH(x.name)}</div>
      <span class="st" data-st="${x.id}" data-lun="${lun}">${vdStTxt(x,lun)}</span></div>
      <div class="vd-cells">${c}</div></div>`;
  });
  let pie="";for(let i=0;i<7;i++)pie+=vdPie(addDaysIso(lun,i));
  return `<div class="vd-nav"><button class="icon-btn" data-sem="-1" aria-label="Semana anterior">${VD_IZQ}</button>
      <div class="t">${act?"Esta semana":fechaCorta(lun)+" – "+fechaCorta(addDaysIso(lun,6))}</div>
      <button class="icon-btn" data-sem="1"${act?" disabled":""} aria-label="Semana siguiente">${VD_DER}</button></div>
    <div class="card" style="padding:14px 16px"><div class="vd-days">${dias}</div>${filas}<div class="vd-foot">${pie}</div></div>
    <p class="sub" style="font-size:11px;margin-top:10px">Toca un cuadro para marcar o corregir ese día. Borde rosa: tocaba y quedó sin marcar. Punteado: ese día no toca.</p>`;
}
function vdVistaMes(hs){
  const n=new Date(),ym=vdMes||{y:n.getFullYear(),m:n.getMonth()};
  const act=ym.y===n.getFullYear()&&ym.m===n.getMonth();
  const first=new Date(ym.y,ym.m,1),dm=new Date(ym.y,ym.m+1,0).getDate(),lead=(first.getDay()+6)%7;
  const a=isoOf(first),b=isoOf(new Date(ym.y,ym.m,dm));
  let cards="";
  hs.forEach(x=>{
    let g="";for(let i=0;i<lead;i++)g+=`<span class="vd-cell blank"></span>`;
    for(let d=1;d<=dm;d++)g+=vdCelda(x,isoOf(new Date(ym.y,ym.m,d)),true);
    cards+=`<div class="card" style="padding:14px 16px;margin-bottom:12px;--hc:var(--c-${x.color})">
      <div class="vd-whead" data-editar="${x.id}" style="margin:0"><div class="vd-ico">${icoVida(x.icon)}</div><div class="vd-name">${escH(x.name)}</div><span class="st">${vdFreqTxt(x)}</span></div>
      <div class="vd-stats3" data-ms="${x.id}" data-a="${a}" data-b="${b}">${vdStats3(x,a,b)}</div>
      <div class="vd-days" style="margin-top:12px;gap:4px">${VD_DIAS.map(d=>`<span>${d}</span>`).join("")}</div>
      <div class="vd-mgrid" style="margin-top:4px">${g}</div></div>`;
  });
  return `<div class="vd-nav"><button class="icon-btn" data-mes="-1" aria-label="Mes anterior">${VD_IZQ}</button>
      <div class="t">${MESES_LARGO[ym.m]} ${ym.y}</div>
      <button class="icon-btn" data-mes="1"${act?" disabled":""} aria-label="Mes siguiente">${VD_DER}</button></div>
    <div class="list-stagger">${cards}</div>`;
}
function renderHabitos(){
  const hs=vdHabitos();
  let h=`<div class="view-head" style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px">
    <div><div class="label">Tu constancia</div><div class="h1" style="margin-top:2px">Hábitos</div></div>
    <button class="btn-secondary vd-mini" data-nuevo="1">+ Nuevo</button></div>`;
  if(!hs.length)h+=vdVacio();
  else{
    h+=`<div class="vd-seg"><button data-modo="semana" class="${vdModo==="semana"?"on":""}">Semana</button><button data-modo="mes" class="${vdModo==="mes"?"on":""}">Mes</button></div>`;
    h+=vdModo==="semana"?vdVistaSemana(hs):vdVistaMes(hs);
  }
  const arch=vida().habits.filter(x=>x.archived).length;
  if(arch)h+=`<button class="btn-secondary section-gap" data-arch="1" style="width:100%">Archivados (${arch})</button>`;
  $("#v-habitos").innerHTML=h;
  $("#v-habitos").onclick=e=>{
    const t=e.target.closest("[data-modo],[data-sem],[data-mes],[data-c],[data-editar],[data-nuevo],[data-idea],[data-arch]");
    if(!t||t.disabled)return;
    if(t.dataset.modo){vdModo=t.dataset.modo;return renderHabitos();}
    if(t.dataset.sem){const lh=vdLunes(todayKey());const base=vdSem||lh;const nx=addDaysIso(base,7*(+t.dataset.sem));vdSem=nx>=lh?null:nx;return renderHabitos();}
    if(t.dataset.mes){const n=new Date(),ym=vdMes||{y:n.getFullYear(),m:n.getMonth()};const d=new Date(ym.y,ym.m+(+t.dataset.mes),1);
      vdMes=(d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth())?null:{y:d.getFullYear(),m:d.getMonth()};return renderHabitos();}
    if(t.dataset.c){const [id,iso]=t.dataset.c.split("|");const x=vdBuscar(id);if(!x)return;
      return x.kind==="count"?vdHojaCantidad(id,iso):vdAlternar(id,iso);}
    if(t.dataset.editar)return vdHojaHabito(t.dataset.editar);
    if(t.dataset.nuevo)return vdHojaHabito();
    if(t.dataset.idea!==undefined)return vdAgregarIdea(+t.dataset.idea);
    if(t.dataset.arch)return vdHojaArchivados();
  };
}

/* ============================================================
   VISTA: RESUMEN — la mirada larga
   ============================================================ */
let vdAnio=null,vdPixModo="animo";
function vdPixeles(){
  const hoy=todayKey(),y=vdAnio||+hoy.slice(0,4),act=y===+hoy.slice(0,4),moods=vida().moods;
  let g="";
  for(let m=0;m<12;m++){
    g+=`<span class="mo">${MESES[m]}</span>`;
    const dm=new Date(y,m+1,0).getDate();
    for(let d=1;d<=31;d++){
      if(d>dm){g+=`<i class="x"></i>`;continue;}
      const iso=isoOf(new Date(y,m,d));let st="",cl="";
      if(iso>hoy)cl="fut";
      else if(vdPixModo==="animo"){const v=(moods[iso]||{}).m;if(v)st=`background:var(--c-${VD_ANIMO[v].c})`;}
      else{const p=vdPctDia(iso);if(p)st=`background:color-mix(in srgb,var(--emerald) ${Math.round(20+p*80)}%,transparent)`;}
      if(iso===hoy)cl+=" today";
      g+=`<i class="${cl.trim()}" style="${st}" data-px="${iso}"></i>`;
    }
  }
  const ley=vdPixModo==="animo"
    ?[1,2,3,4,5].map(i=>`<span><i style="background:var(--c-${VD_ANIMO[i].c})"></i>${VD_ANIMO[i].n}</span>`).join("")
    :[25,50,75,100].map(p=>`<span><i style="background:color-mix(in srgb,var(--emerald) ${Math.round(20+p*.8)}%,transparent)"></i>${p}%</span>`).join("");
  return `<div class="card section-gap" style="padding:16px">
    <div class="card-head"><div class="h3" style="font-size:14px">Tu año en píxeles</div>
      <div class="acts" style="align-items:center;gap:4px"><button class="icon-btn" data-anio="-1" style="width:30px;height:30px" aria-label="Año anterior">${VD_IZQ}</button>
      <span class="label-mono" style="min-width:34px;text-align:center">${y}</span>
      <button class="icon-btn" data-anio="1" style="width:30px;height:30px"${act?" disabled":""} aria-label="Año siguiente">${VD_DER}</button></div></div>
    <div class="vd-seg mini" style="margin-top:10px"><button data-pixm="animo" class="${vdPixModo==="animo"?"on":""}">Ánimo</button><button data-pixm="habitos" class="${vdPixModo==="habitos"?"on":""}">Hábitos cumplidos</button></div>
    <div class="vd-pix">${g}</div><div class="vd-legend">${ley}</div></div>`;
}
function renderResumen(){
  const hoy=todayKey(),hs=vdHabitos(),n=new Date();
  const lun=vdLunes(hoy),ini=isoOf(new Date(n.getFullYear(),n.getMonth(),1));
  const pSem=vdPctRango(lun,hoy),pPas=vdPctRango(addDaysIso(lun,-7),addDaysIso(lun,-1));
  let perf=0;for(let iso=ini;iso<=hoy;iso=addDaysIso(iso,1))if(vdPctDia(iso)===1)perf++;
  let best=null;hs.forEach(x=>{const r=vdRacha(x);if(r.n>0&&(!best||r.n>best.r.n))best={x,r};});
  const ms=Object.entries(vida().moods).filter(([iso,v])=>iso>=ini&&iso<=hoy&&v.m).map(([,v])=>v.m);
  const avg=ms.length?ms.reduce((a,b)=>a+b,0)/ms.length:null;
  const delta=pSem!=null&&pPas!=null?Math.round((pSem-pPas)*100):null;
  let h=`<div class="view-head"><div class="label">La mirada larga</div><div class="h1" style="margin-top:2px">Resumen</div></div>
    <div class="stat-grid list-stagger">
      <div class="stat"><div class="sv">${pSem==null?"–":Math.round(pSem*100)+"<small>%</small>"}${delta!=null?`<small style="color:var(--${delta>=0?"emerald":"rose"})" title="Contra la semana pasada">${delta>=0?"+":""}${delta}</small>`:""}</div><div class="sl">Hábitos esta semana</div></div>
      <div class="stat"><div class="sv">${perf}</div><div class="sl">Días perfectos del mes</div></div>
      <div class="stat"><div class="sv">${best?best.r.n+`<small>${best.r.u}</small>`:"0"}</div><div class="sl">${best?"Racha · "+escH(best.x.name):"Mejor racha activa"}</div></div>
      <div class="stat"><div class="sv" style="font-size:${avg?"21":"26"}px">${avg?VD_ANIMO[Math.round(avg)].n:"–"}</div><div class="sl">Ánimo del mes${ms.length?` · ${ms.length} ${ms.length===1?"día":"días"}`:""}</div></div>
    </div>`;
  h+=vdPixeles();
  // Constancia de cada hábito en los últimos 30 días, de mayor a menor
  const a30=addDaysIso(hoy,-29);
  const rk=hs.map(x=>({x,p:vdPct(x,a30,hoy)})).filter(r=>r.p!=null).sort((a,b)=>b.p-a.p);
  h+=`<div class="card section-gap" style="padding:16px"><div class="h3" style="font-size:14px;margin-bottom:6px">Constancia · últimos 30 días</div>
    ${rk.length?rk.map(r=>`<div class="vd-rank" style="--hc:var(--c-${r.x.color})"><div class="nm">${escH(r.x.name)}</div>
      <div class="br"><i style="width:${Math.round(r.p*100)}%"></i></div><div class="pc">${Math.round(r.p*100)}%</div></div>`).join("")
      :`<p class="sub" style="font-size:12px">Aparece en cuanto tus hábitos tengan al menos un día registrado.</p>`}</div>`;
  // Diario: lo que se escribió en el check-in
  const notas=Object.entries(vida().moods).filter(([,v])=>v.note).sort((a,b)=>a[0]<b[0]?1:-1).slice(0,14);
  h+=`<div class="card section-gap" style="padding:16px"><div class="h3" style="font-size:14px;margin-bottom:6px">Diario</div>
    ${notas.length?notas.map(([iso,v])=>`<div class="vd-nota" style="--hc:var(--c-${v.m?VD_ANIMO[v.m].c:"slate"})"><span class="dt"></span>
      <div style="min-width:0"><div class="f">${fechaLarga(iso)}${v.m?" · "+VD_ANIMO[v.m].n:""}</div><div class="tx">${escH(v.note)}</div></div></div>`).join("")
      :`<p class="sub" style="font-size:12px">Las líneas que escribas en «¿Cómo va tu día?» se guardan aquí.</p>`}</div>`;
  $("#v-resumen").innerHTML=h;
  $("#v-resumen").onclick=e=>{
    const t=e.target.closest("[data-anio],[data-pixm],[data-px]");if(!t||t.disabled)return;
    if(t.dataset.anio){const y=(vdAnio||+todayKey().slice(0,4))+(+t.dataset.anio);vdAnio=y>=+todayKey().slice(0,4)?null:y;return renderResumen();}
    if(t.dataset.pixm){vdPixModo=t.dataset.pixm;return renderResumen();}
    if(t.dataset.px){
      const iso=t.dataset.px;if(iso>todayKey())return;
      const m=vida().moods[iso],p=vdPctDia(iso);
      toast(`${fechaCorta(iso)} · ${m&&m.m?VD_ANIMO[m.m].n:"sin ánimo"}${p!=null?" · "+Math.round(p*100)+"% hábitos":""}`);
    }
  };
}

/* ============================================================
   NAVEGACIÓN + INIT
   ============================================================ */
/* v3: el dock es del panel de vida. El gimnasio entero vive bajo «Cuerpo», con su propia
   sub-navegación; sus vistas conservan los mismos ids de siempre (hoy, calendario…). */
const VIEWS=[["inicio","Hoy"],["habitos","Hábitos"],["cuerpo","Cuerpo"],["resumen","Resumen"]];
const CUERPO=[["hoy","Entreno"],["calendario","Calendario"],["rutinas","Rutinas"],["ejercicios","Ejercicios"],["nutricion","Nutrición"]];
let ultimaCuerpo="hoy";
const esCuerpo=v=>CUERPO.some(x=>x[0]===v);
function pestanaDe(v){return esCuerpo(v)?"cuerpo":VIEWS.some(x=>x[0]===v)?v:null;}

  habitos:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14.5 17.5l2 2 4-4"/></svg>',
  cuerpo:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>',
  resumen:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
});
function montarSubnav(){
  const n=$("#cuerpoNav");

/* El dock se construye UNA sola vez y despues solo se mueve la pildora.
   Antes se reescribia el innerHTML entero en cada cambio de vista: con eso
   la pildora se destruia y volvia a nacer en su nuevo sitio, que es
   justamente el efecto que el sistema no quiere (STICK_UI_SYSTEM.md §4.5 —
   una sola pildora que VIAJA, como el `layoutId` de las apps React). */
function montarDock(){
  const dock=$("#dock");
  dock.innerHTML='<span class="dock-pildora" id="dockPildora"></span>'+
    VIEWS.map(([id,l])=>`<button class="dock-btn${id===curView?" on":""}" data-view="${id}" title="${l}" aria-label="${l}">${IC[id]}<span class="dl">${l}</span></button>`).join("");
  // «Cuerpo» no es una vista: abre la última sección del gimnasio que se usó.
  dock.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
    const v=b.dataset.view==="cuerpo"?ultimaCuerpo:b.dataset.view;
    if(v==="hoy")selectedDay=jsDayToId();
    go(v);
  });
  // Al cambiar de ancho (girar el telefono, abrir/cerrar teclado) las
  // etiquetas aparecen o desaparecen y los botones cambian de ancho: la
  // pildora tiene que volver a medirse o queda corrida.
  window.addEventListener("resize",()=>renderDock(true),{passive:true});
  renderDock(true);
}
function renderDock(inmediato){
  const dock=$("#dock");if(!dock)return;
  const pildora=$("#dockPildora");if(!pildora)return;
  let activo=null;
  /* El Perfil no es una pestana: la pildora se queda donde estaba, pero el boton de debajo tiene
     que seguir pintado en claro. Sin esto quedaba un icono gris sobre la pildora blanca. */
  const marcado=pestanaDe(curView)||ultimaPestana;
  dock.querySelectorAll("[data-view]").forEach(b=>{
    const on=b.dataset.view===marcado;
    b.classList.toggle("on",on);
    b.setAttribute("aria-current",on?"page":"false");
    if(on)activo=b;
  });
  if(!activo)return;
  // Con `#app` todavia en display:none (portada), todo mide 0: colocar la
  // pildora ahi la dejaria naciendo en el borde izquierdo. Se sale y ya se
  // volvera a llamar al mostrar la app.
  if(activo.offsetWidth===0)return;
  // La primera colocacion va sin transicion: si no, la pildora entra
  // volando desde el borde izquierdo la primera vez que carga la app.
  if(inmediato){pildora.style.transition="none";}
  pildora.style.setProperty("--px",activo.offsetLeft+"px");
  pildora.style.setProperty("--pw",activo.offsetWidth+"px");
  if(inmediato){void pildora.offsetWidth;pildora.style.transition="";}
}
let ultimaPestana="inicio"; // ultima pestaña del dock, para que la pildora no quede huerfana en Perfil
function go(v){
  conTransicion(()=>_go(v));
}
function _go(v){
  curView=v;
  const p=pestanaDe(v);
  if(p)ultimaPestana=p;
  if(esCuerpo(v))ultimaCuerpo=v;
  const sn=$("#cuerpoNav");
  sn.classList.toggle("on",esCuerpo(v));
  sn.querySelectorAll("[data-sub]").forEach(b=>{const on=b.dataset.sub===v;b.classList.toggle("on",on);b.setAttribute("aria-current",on?"page":"false");});
  document.querySelectorAll(".view").forEach(el=>{el.classList.remove("on");el.style.viewTransitionName="";});
  const el=$("#v-"+v);el.classList.add("on");
  /* Solo la vista visible lleva el nombre: dos elementos con el mismo view-transition-name a la
     vez hacen que el navegador aborte la transicion entera sin avisar. */
  el.style.viewTransitionName="vista";
  el.classList.remove("animate-page");void el.offsetWidth;el.classList.add("animate-page");
  ({inicio:renderInicio,habitos:renderHabitos,resumen:renderResumen,
    hoy:renderHoy,calendario:renderCalendario,perfil:renderPerfil,rutinas:renderRutinas,ejercicios:renderEjercicios,nutricion:renderNutricion})[v]();
  renderDock();
  const vv=VIEWS.find(x=>x[0]===v),cv=CUERPO.find(x=>x[0]===v);
  $("#headerSub").textContent=(cv?"Cuerpo · "+cv[1]:vv?vv[1]:v).toUpperCase();
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- Sheet helpers ---------- */
function openSheet(html){$("#sheet").onclick=null; /* el editor de hábitos delega aquí; no debe sobrevivir a su hoja */
  $("#sheet").innerHTML=html;$("#overlay").classList.add("open");
  $("#sheet").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet);}
function closeSheet(){$("#overlay").classList.remove("open");}
$("#overlay").onclick=e=>{if(e.target===$("#overlay"))closeSheet();};
/* Segundo overlay apilado (para selectores abiertos desde otra hoja, ej. añadir ejercicio) */
function openSheet2(html){$("#sheet2").innerHTML=html;$("#overlay2").classList.add("open");
  $("#sheet2").querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet2);}
/* Gancho de cierre de un solo uso: lo usa el diagrama de medidas para apagar el músculo
   resaltado se cierre como se cierre la hoja (botón, scrim o guardado). */
let sheet2Hook=null;
function closeSheet2(){$("#overlay2").classList.remove("open");
  if(sheet2Hook){const f=sheet2Hook;sheet2Hook=null;f();}}
$("#overlay2").onclick=e=>{if(e.target===$("#overlay2"))closeSheet2();};

/* Hojas reutilizables (reemplazan prompt()/confirm() nativos) */
function promptSheet(o){
  openSheet2(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">${o.title}</div><button class="close-x" data-close>×</button></div>
    <div class="field" style="margin-top:12px"><label>${o.label||""}</label><input type="text" id="ps-input" value="${(o.value||"").replace(/"/g,"&quot;")}" placeholder="${o.placeholder||""}"></div>
    <button class="btn-primary" style="width:100%" id="ps-save">${o.cta||"Guardar"}</button>`);
  const inp=$("#ps-input");inp.focus();try{inp.select();}catch(_){}
  $("#ps-save").onclick=()=>{const v=inp.value.trim();if(!v)return toast("Escribe un nombre");closeSheet2();o.onSave(v);};
}
function confirmSheet(o){
  openSheet2(`<div class="sheet-grab"></div><div class="sheet-head"><div class="h2">${o.title}</div><button class="close-x" data-close>×</button></div>
    <p class="sub" style="margin:8px 0 18px">${o.message||""}</p>
    <div style="display:flex;gap:8px">
      <button class="btn-secondary" style="flex:1" data-close>Cancelar</button>
      <button class="${o.danger?"btn-danger":"btn-primary"}" style="flex:1" id="cs-ok">${o.cta||"Confirmar"}</button>
    </div>`);
  $("#cs-ok").onclick=()=>{closeSheet2();o.onConfirm();};
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){$("#toastMsg").textContent=msg;$("#toast").classList.add("show");
  clearTimeout(toastT);toastT=setTimeout(()=>$("#toast").classList.remove("show"),1900);}

/* ---------- Rescate de datos de la versión anterior (v2) ----------
   El rediseño arranca con clave limpia (`stickfit-v2`) por decisión del Señor Stick, pero el
   perfil, el peso corporal y las medidas son datos del cuerpo, no del entrenamiento: recapturarlos
   a mano es tedioso y parte no se podría reconstruir. Se ofrece UNA vez y no vuelve. */
function ofrecerRescate(){
  if(S.rescateOfrecido)return;
  const v=hayDatosV1();
  if(!v){descartarRescate();return;}
  const n=(v.weightLog||[]).length, m=(v.measures||[]).length, p=v.profile?1:0;
  const piezas=[];
  if(p)piezas.push("tu perfil de nutrición");
  if(n)piezas.push(`${n} ${n===1?"registro":"registros"} de peso`);
  if(m)piezas.push(`${m} ${m===1?"toma":"tomas"} de medidas`);
  openSheet(`<div class="sheet-grab"></div>
    <div class="sheet-head"><div>
      <div class="h2">Encontré tus datos anteriores</div>
      <div class="sub" style="font-size:11px;margin-top:3px">De la versión anterior de STICK FIT</div>
    </div></div>
    <p class="sub" style="margin:10px 0 0;font-size:12px">
      Puedo traer <b style="color:var(--zinc-300)">${piezas.join(", ")}</b>.
      El historial de entrenamiento y las rutinas viejas no se traen: esta versión arranca limpia.</p>
    <div style="display:flex;gap:8px;margin-top:18px">
      <button class="btn-secondary" style="flex:1" id="rsNo">Empezar limpio</button>
      <button class="btn-primary" style="flex:1.4" id="rsYes">Traer mis datos</button>
    </div>`);
  $("#rsYes").onclick=()=>{rescatarV1();closeSheet();toast("Datos recuperados");go(curView||"hoy");};
  $("#rsNo").onclick=()=>{descartarRescate();closeSheet();};
}

setTimeout(ofrecerRescate,400);

/* ---------- Anti-zoom (familia Stick) ----------
   Safari en iOS IGNORA `user-scalable=no` y `maximum-scale` desde iOS 10, así
   que el meta viewport no basta: el zoom hay que interceptarlo evento por
   evento. Todos los listeners van en `document` con `passive:false` (sin eso
   el navegador ignora el preventDefault en eventos táctiles).
   Detalle en STICK_UI_SYSTEM.md §6.6.1. */
(function(){
  const stop=e=>e.preventDefault();

  // 1. Escritorio: pinch de trackpad y Ctrl+rueda llegan como 'wheel'.
  document.addEventListener("wheel",e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

  // 2. Safari (iOS y macOS): eventos propietarios del pinch.
  for(const t of ["gesturestart","gesturechange","gestureend"])
    document.addEventListener(t,stop,{passive:false});

  // 3. iPhone: el pinch real son dos dedos. Cortarlo aquí es lo único que de
  //    verdad frena el zoom en Safari móvil.
  document.addEventListener("touchstart",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
  document.addEventListener("touchmove", e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});

  // 4. iPhone: doble toque para hacer zoom. Se anula solo si los dos toques
  //    caen en el mismo punto (<30px) y en menos de 300ms — así marcar dos
  //    ejercicios seguidos NO pierde el segundo toque.
  let tPrev=0,xPrev=0,yPrev=0;
  document.addEventListener("touchend",e=>{
    const t=e.changedTouches[0]; if(!t) return;
    if(e.timeStamp-tPrev<=300 && Math.abs(t.clientX-xPrev)<30 && Math.abs(t.clientY-yPrev)<30)
      e.preventDefault();
    tPrev=e.timeStamp; xPrev=t.clientX; yPrev=t.clientY;
  },{passive:false});

  // 5. Atajo de teclado. El navegador lo reserva y no siempre cede.
  document.addEventListener("keydown",e=>{
    if((e.ctrlKey||e.metaKey)&&["+","-","=","_","0"].includes(e.key))e.preventDefault();
  },{passive:false});
})();

/* ---------- Modo claro (STICK_UI_SYSTEM.md §10) ----------
   La clase `light` ya la pone el script anti-destello del <head> antes del
   primer pintado; aquí solo se alterna y se persiste. */
$("#btnTema").addEventListener("click",()=>{
  const claro=document.documentElement.classList.toggle("light");
  try{localStorage.setItem("stick:tema",claro?"claro":"oscuro");}catch(e){}
  $("#btnTema").title=claro?"Modo oscuro":"Modo claro";
});
